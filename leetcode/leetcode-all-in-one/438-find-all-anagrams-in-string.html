<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>438. Find All Anagrams in a String</title>
<link rel="stylesheet" href="shared.css?v=info-hud">
<style>
  .str-row { display: flex; align-items: flex-end; gap: 6px; }
  .str-cell { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .cell-box {
    width: 44px; height: 44px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700; font-family: 'SF Mono', monospace;
    background: #f5f5f5; color: #1a1a1a;
    transition: background 0.2s, transform 0.2s, opacity 0.2s;
  }
  .cell-box.in-window { background: rgba(139,133,212,0.22); }
  .cell-box.active-j { background: rgba(249,203,66,0.50); transform: scale(1.08); }
  .cell-box.shrinking { background: rgba(93,202,165,0.45); }
  .cell-box.matched { background: rgba(93,202,165,0.52); transform: scale(1.04); }
  .cell-box.mismatch { background: rgba(247,140,108,0.24); }
  .cell-box.done { opacity: 0.28; }
  .cell-idx { font-size: 11px; color: #aaa; font-family: 'SF Mono', monospace; }
  .cell-ptr { font-size: 11px; font-weight: 700; font-family: 'SF Mono', monospace; height: 16px; line-height: 16px; white-space: nowrap; }
  .ptr-i { color: #3A6FD4; }
  .ptr-j { color: #B07800; }
  .ptr-both { color: #C4501E; }

  .window-bar { display: flex; gap: 6px; height: 5px; margin-top: 5px; margin-bottom: 2px; }
  .win-seg { width: 44px; height: 5px; border-radius: 3px; background: transparent; transition: background 0.2s; }
  .win-seg.in-window { background: rgba(139,133,212,0.55); }
  .win-seg.matched { background: rgba(93,202,165,0.72); }
  .win-seg.mismatch { background: rgba(247,140,108,0.55); }

  .main.layout-grid.lc438-layout {
    --split-gap: 20px;
    width: min(1320px, 100%);
    column-gap: var(--split-gap);
    grid-template-columns:
      minmax(0, calc((100% - var(--split-gap)) / 2))
      minmax(0, calc((100% - var(--split-gap)) / 2));
    justify-content: stretch;
  }
  .main.layout-grid.lc438-layout .code-half {
    grid-column: 1;
    grid-row: 1;
    width: 100%;
    min-width: 0;
    justify-content: stretch;
  }
  .main.layout-grid.lc438-layout .viz-panel {
    grid-column: 2;
    grid-row: 1;
    width: 100%;
    min-width: 0;
  }
  .lc438-layout .code-stack,
  .lc438-layout .step-info,
  .lc438-layout .code-panel,
  .lc438-layout .var-bar,
  .lc438-layout .card {
    width: 100%;
    min-width: 0;
  }
  .lc438-layout .code-block { overflow-x: auto; }
  .lc438-layout .step-info {
    min-height: 38px;
    padding: 8px 14px;
    line-height: 20px;
  }
  .lc438-layout .str-row,
  .lc438-layout .window-bar { justify-content: center; }
  .page-header .leg-item { font-size: 11px; white-space: nowrap; }

  .maps-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .maps-result-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(120px, 0.28fr);
    gap: 24px;
    align-items: start;
  }
  .map-title {
    font-size: 11px;
    font-weight: 700;
    color: #1a1a1a;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 8px;
  }
  .maps-area {
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: flex-start;
    min-height: 38px;
  }
  .map-entry {
    display: flex;
    align-items: center;
    gap: 3px;
    background: #f5f5f5;
    border-radius: 6px;
    padding: 4px 10px;
    font-family: 'SF Mono', monospace;
    font-size: 13px;
    transition: background 0.2s, opacity 0.2s;
  }
  .map-entry.active { background: rgba(249,203,66,0.42); }
  .map-entry.need { background: rgba(139,133,212,0.22); }
  .map-entry.bad { background: rgba(247,140,108,0.35); }
  .map-entry.good { background: rgba(93,202,165,0.38); }
  .map-entry.zero { opacity: 0.32; }
  .map-key { color: #9333C0; font-weight: 700; }
  .map-colon { color: #888; margin: 0 1px; }
  .map-val { color: #C4501E; font-weight: 700; }
  .empty-map { font-size: 12px; color: #aaa; font-family: 'SF Mono', monospace; }

  .combined-state { display: block; }
  .state-col {
    display: grid;
    grid-template-columns: minmax(0, max-content);
    row-gap: 8px;
    min-width: 0;
  }
  .input-extra-row,
  .input-window-row {
    margin-top: 14px;
    min-height: 19px;
    font-family: 'SF Mono', 'Menlo', monospace;
    font-size: 13px;
    line-height: 19px;
    color: #555;
  }

  .result-list {
    display: flex;
    gap: 8px;
    min-height: 36px;
    align-items: center;
    font-family: 'SF Mono', monospace;
  }
  .result-pill {
    min-width: 36px;
    height: 30px;
    border-radius: 8px;
    background: rgba(93,202,165,0.35);
    color: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 800;
  }
</style>
</head>
<body>
<link rel="stylesheet" href="ink.css">
<script src="catalog.js"></script>
<script src="sidebar.js"></script>
<script src="shared.js?v=copybtn"></script>

<div class="content-wrapper">
<script>
renderHeader({
  title: '438. Find All Anagrams in a String',
  link: 'https://leetcode.com/problems/find-all-anagrams-in-a-string/',
  examples: [
    { id: 'lc1', label: 's = "cbaebabacd", p = "abc" → [0, 6]' },
    { id: 'lc2', label: 's = "abab", p = "ab" → [0, 1, 2]' },
  ],
  examplesLabel: 'Example:',
  legend: [
    { color: 'rgba(249,203,66,0.50)', label: 's[j] enters window' },
    { color: 'rgba(139,133,212,0.22)', label: 'current window [i..j]' },
    { color: 'rgba(93,202,165,0.45)', label: 's[i] leaves window' },
    { color: 'rgba(93,202,165,0.52)', label: 'anagram found' },
    { color: 'rgba(247,140,108,0.35)', label: 'need != window' },
  ],
});
</script>
<div class="main layout-grid lc438-layout">

  <script>
  renderCodeBox({
    code: `
class Solution:
    def findAnagrams(self, s: str, p: str) -> List[int]:
        need = {}
        for letter in p:
            need[letter] = need.get(letter, 0) + 1

        i = 0
        j = 0
        window = {}
        res = []


        for j in range(len(s)):
            window[s[j]] = window.get(s[j],0) + 1
            while j - i + 1 > len(p):
                window[s[i]] -= 1
                if window[s[i]] == 0:
                    window.pop(s[i])
                i += 1

            if  j - i + 1 == len(p):
                if need == window:
                    res.append(i)

        return res`,
  });
  </script>

  <div class="viz-panel">
    <div class="card">
      <h3 id="input-title">Input  s = "cbaebabacd", p = "abc"</h3>
      <div class="str-row" id="str-row"></div>
      <div class="window-bar" id="window-bar"></div>
      <div class="input-extra-row" id="input-extra-row"></div>
      <div class="input-window-row" id="input-window-row"></div>
    </div>

    <div class="var-bar combined-state" id="state-bar">
      <div class="state-col" id="maps-col">
        <span class="var-row"></span>
        <span class="var-row"></span>
      </div>
    </div>

    <div class="card">
      <div class="maps-result-grid">
        <div>
          <h3>Frequency Maps</h3>
          <div class="maps-grid">
            <div>
              <div class="map-title">need from p</div>
              <div class="maps-area" id="need-area"></div>
            </div>
            <div>
              <div class="map-title">window</div>
              <div class="maps-area" id="window-area"></div>
            </div>
          </div>
        </div>
        <div>
          <h3>Result res</h3>
          <div class="result-list" id="result-list"><span class="empty-map">res = []</span></div>
        </div>
      </div>
    </div>
  </div>
</div>
</div>

<script>
// ── Examples ─────────────────────────────────────────────────────────────
const EXAMPLES = {
  lc1: { s: "cbaebabacd", p: "abc" },  // → [0, 6]
  lc2: { s: "abab", p: "ab" },         // → [0, 1, 2]
};

let S = EXAMPLES.lc1.s;
let P = EXAMPLES.lc1.p;

function sameMap(a, b) {
  const keys = new Set([...Object.keys(a), ...Object.keys(b)]);
  for (const key of keys) {
    if ((a[key] || 0) !== (b[key] || 0)) return false;
  }
  return true;
}

function buildSteps() {
  const steps = [];
  let need = {};
  let winMap = {};
  let i = null, j = null;
  let res = [];
  let needReady = false, windowReady = false;
  let shrinkIdx = null, addKey = null, removeKey = null, popKey = null, compareStatus = null, matchRange = null;

  function snap(line, info) {
    steps.push({
      line, info, i, j, res: [...res],
      need: { ...need }, window: { ...winMap },
      needReady, windowReady, shrinkIdx, addKey, removeKey, popKey,
      compareStatus, matchRange
    });
  }

  needReady = true;
  snap(3, 'need = {}  (build the target frequency map from p)');
  for (const letter of P) {
    snap(4, `letter = '${letter}' from p`);
    need[letter] = (need[letter] || 0) + 1;
    snap(5, `need['${letter}'] = ${need[letter]}  (need this many in a valid window)`);
  }

  i = 0;
  snap(7, 'i = 0  (left boundary of the sliding window)');
  j = 0;
  snap(8, 'j = 0  (right boundary before the loop starts)');
  winMap = {};
  windowReady = true;
  snap(9, 'window = {}  (frequency map for the current window)');
  res = [];
  snap(10, 'res = []  (store starting indexes of valid anagrams)');

  for (let jj = 0; jj < S.length; jj++) {
    j = jj; addKey = null; removeKey = null; shrinkIdx = null; popKey = null; compareStatus = null; matchRange = null;
    snap(13, `j = ${jj}  ->  inspect s[${jj}] = '${S[jj]}'`);
    addKey = S[jj];
    winMap[addKey] = (winMap[addKey] || 0) + 1;
    snap(14, `window[s[${jj}]] = window.get('${addKey}', 0) + 1  ->  window['${addKey}'] = ${winMap[addKey]}`);

    if (j - i + 1 > P.length) {
      snap(15, `window length ${j - i + 1} > len(p) ${P.length}; shrink from left`);
      while (j - i + 1 > P.length) {
        removeKey = S[i];
        shrinkIdx = i;
        winMap[removeKey] -= 1;
        snap(16, `window[s[${i}]] -= 1  ->  window['${removeKey}'] = ${winMap[removeKey]}`);
        if (winMap[removeKey] === 0) {
          snap(17, `window[s[${i}]] == 0  ->  remove '${removeKey}' from window`);
          popKey = removeKey;
          delete winMap[removeKey];
          snap(18, `window.pop(s[${i}])`);
          popKey = null;
        } else {
          snap(17, `window[s[${i}]] = ${winMap[removeKey]}  ->  keep '${removeKey}' in window`);
        }
        i += 1;
        shrinkIdx = null;
        snap(19, `i += 1  ->  i = ${i}`);
      }
      snap(15, `window length is now ${j - i + 1}, so it matches len(p)`);
    } else {
      snap(15, `window length ${j - i + 1} <= len(p) ${P.length}; no shrink needed`);
    }

    if (j - i + 1 === P.length) {
      compareStatus = 'checking';
      snap(21, `window "${S.slice(i, j + 1)}" has length ${P.length}; compare maps`);
      compareStatus = sameMap(need, winMap) ? 'match' : 'mismatch';
      snap(22, compareStatus === 'match'
        ? `need == window  ->  "${S.slice(i, j + 1)}" is an anagram`
        : `need != window  ->  "${S.slice(i, j + 1)}" is not an anagram`);
      if (compareStatus === 'match') {
        res.push(i);
        matchRange = [i, j];
        snap(23, `res.append(${i})  ->  res = [${res.join(', ')}]`);
      }
    } else {
      snap(21, `window length ${j - i + 1} is not ${P.length}; wait for a full-size window`);
    }
  }

  compareStatus = null; matchRange = null; shrinkIdx = null;
  snap(25, `return res = [${res.join(', ')}]`);
  return steps;
}

let STEPS = buildSteps();
let cur = -1;

function formatMapInline(map) {
  const entries = Object.entries(map);
  if (entries.length === 0) return '{}';
  return `{ ${entries.map(([k, v]) => `'${k}': ${v}`).join(', ')} }`;
}

function renderVarBar(state) {
  const empty = '<span class="var-row"></span>';
  if (!state) {
    document.getElementById('maps-col').innerHTML =
      `<span class="var-row"><span class="var-name">need</span><span class="var-eq"> = </span><span style="color:#333;">{}</span></span>` +
      empty;
    document.getElementById('input-extra-row').innerHTML = '';
    document.getElementById('input-window-row').innerHTML = '';
    return;
  }

  const windowText = state.i !== null && state.j !== null
    ? `Window: <strong>"${S.slice(state.i, state.j + 1)}"</strong> (len ${state.j - state.i + 1})`
    : '';
  const mapRows = [
    state.needReady
      ? `<span class="var-row"><span class="var-name">need</span><span class="var-eq"> = </span><span style="color:#333;">${formatMapInline(state.need)}</span></span>`
      : empty,
    state.windowReady
      ? `<span class="var-row"><span class="var-name">window</span><span class="var-eq"> = </span><span style="color:#333;">${formatMapInline(state.window)}</span></span>`
      : empty,
  ];
  document.getElementById('maps-col').innerHTML = mapRows.join('');
  document.getElementById('input-extra-row').innerHTML = '';
  document.getElementById('input-window-row').innerHTML = windowText;
}

function buildStringDOM() {
  const row = document.getElementById('str-row');
  const winBar = document.getElementById('window-bar');
  row.innerHTML = '';
  winBar.innerHTML = '';
  for (let idx = 0; idx < S.length; idx++) {
    const cell = document.createElement('div');
    cell.className = 'str-cell';

    const box = document.createElement('div');
    box.className = 'cell-box';
    box.id = `cell-${idx}`;
    box.textContent = S[idx];
    cell.appendChild(box);

    const idxLbl = document.createElement('div');
    idxLbl.className = 'cell-idx';
    idxLbl.textContent = idx;
    cell.appendChild(idxLbl);

    const ptrLbl = document.createElement('div');
    ptrLbl.className = 'cell-ptr';
    ptrLbl.id = `ptr-${idx}`;
    cell.appendChild(ptrLbl);

    row.appendChild(cell);

    const seg = document.createElement('div');
    seg.className = 'win-seg';
    seg.id = `win-${idx}`;
    winBar.appendChild(seg);
  }
}

function renderMap(areaId, map, ready, state, kind) {
  const area = document.getElementById(areaId);
  if (!ready || Object.keys(map).length === 0) {
    area.innerHTML = `<span class="empty-map">${kind} = {}</span>`;
    return;
  }
  const compareKeys = new Set([...Object.keys(state.need), ...Object.keys(state.window)]);
  area.innerHTML = Object.entries(map).map(([k, v]) => {
    let cls = 'map-entry';
    const isActiveAdd = kind === 'window' && state.addKey === k && state.line === 14;
    const isActivePop = kind === 'window' && (state.removeKey === k || state.popKey === k) && state.line >= 16 && state.line <= 18;
    if (isActiveAdd || isActivePop) cls += ' active';
    if (state.compareStatus === 'match' && compareKeys.has(k)) cls += ' good';
    if (state.compareStatus === 'mismatch' && (state.need[k] || 0) !== (state.window[k] || 0)) cls += ' bad';
    if (kind === 'need' && state.compareStatus === 'checking') cls += ' need';
    if (v === 0) cls += ' zero';
    return `<div class="${cls}"><span class="map-key">'${k}'</span><span class="map-colon">:</span><span class="map-val">${v}</span></div>`;
  }).join('');
}

function renderResult(res) {
  const area = document.getElementById('result-list');
  if (res.length === 0) {
    area.innerHTML = '<span class="empty-map">res = []</span>';
    return;
  }
  area.innerHTML = res.map(value => `<span class="result-pill">${value}</span>`).join('');
}

function render() {
  if (cur < 0) {
    for (let idx = 0; idx < S.length; idx++) {
      const box = document.getElementById(`cell-${idx}`);
      const ptr = document.getElementById(`ptr-${idx}`);
      const seg = document.getElementById(`win-${idx}`);
      if (box) box.className = 'cell-box';
      if (ptr) { ptr.textContent = ''; ptr.className = 'cell-ptr'; }
      if (seg) seg.className = 'win-seg';
    }
    renderVarBar(null);
    document.getElementById('need-area').innerHTML = '<span class="empty-map">need = {}</span>';
    document.getElementById('window-area').innerHTML = '<span class="empty-map">window = {}</span>';
    renderResult([]);
    renderCtrl(-1, STEPS.length, '');
    highlightLine(null);
    return;
  }

  const state = STEPS[cur];
  highlightLine(state.line);
  renderCtrl(cur, STEPS.length, state.info);

  for (let idx = 0; idx < S.length; idx++) {
    const box = document.getElementById(`cell-${idx}`);
    const ptr = document.getElementById(`ptr-${idx}`);
    const seg = document.getElementById(`win-${idx}`);
    if (!box || !ptr || !seg) continue;

    const isJ = state.j !== null && idx === state.j;
    const isI = state.i !== null && idx === state.i;
    const isShrink = state.shrinkIdx !== null && idx === state.shrinkIdx;
    const inWindow = state.i !== null && state.j !== null && idx >= state.i && idx <= state.j;
    const isDone = state.i !== null && idx < state.i;
    const isMatched = state.matchRange && idx >= state.matchRange[0] && idx <= state.matchRange[1];
    const isMismatch = state.compareStatus === 'mismatch' && inWindow;

    let cls = 'cell-box';
    if (isMatched) cls += ' matched';
    else if (isShrink) cls += ' shrinking';
    else if (isJ) cls += ' active-j';
    else if (isMismatch) cls += ' mismatch';
    else if (inWindow) cls += ' in-window';
    else if (isDone) cls += ' done';
    box.className = cls;

    if (isShrink && isJ) { ptr.textContent = `i = j = ${idx}`; ptr.className = 'cell-ptr ptr-both'; }
    else if (isShrink) { ptr.textContent = `i = ${idx}`; ptr.className = 'cell-ptr ptr-i'; }
    else if (isI && isJ) { ptr.textContent = `i = j = ${idx}`; ptr.className = 'cell-ptr ptr-both'; }
    else if (isI) { ptr.textContent = `i = ${idx}`; ptr.className = 'cell-ptr ptr-i'; }
    else if (isJ) { ptr.textContent = `j = ${idx}`; ptr.className = 'cell-ptr ptr-j'; }
    else { ptr.textContent = ''; ptr.className = 'cell-ptr'; }

    let segCls = 'win-seg';
    if (isMatched) segCls += ' matched';
    else if (isMismatch) segCls += ' mismatch';
    else if (inWindow) segCls += ' in-window';
    seg.className = segCls;
  }

  renderVarBar(state);
  renderMap('need-area', state.need, state.needReady, state, 'need');
  renderMap('window-area', state.window, state.windowReady, state, 'window');
  renderResult(state.res);
}

// ── Example switcher ─────────────────────────────────────────────────────
function loadExample(id) {
  const ex = EXAMPLES[id];
  if (!ex) return;
  stopAuto();
  S = ex.s;
  P = ex.p;
  document.getElementById('input-title').textContent = `Input  s = "${S}", p = "${P}"`;
  buildStringDOM();
  STEPS = buildSteps();
  cur = -1;
  render();
  lockStableSizes(); // re-pin block heights for the new example's steps
  Object.keys(EXAMPLES).forEach(k => {
    const btn = document.getElementById('ex-' + k);
    if (btn) btn.classList.toggle('auto-active', k === id);
  });
}

loadExample('lc1');
</script>
</body>
</html>
