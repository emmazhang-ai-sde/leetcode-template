<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>252. Meeting Rooms</title>
<link rel="stylesheet" href="shared.css?v=info-hud">
<style>
  .meeting-layout {
    --meeting-code-width: 860px;
    /* 610 = 卡片内边距 36 + Active Meetings 说明行最长约 562（2026-08-27
       实测），再窄那行就要换行 */
    --meeting-viz-width: 610px;
    --meeting-label-width: 74px;
  }
  /* Fixed panel widths hanging off the shared center line: the code panel ends
     at the center, the viz panel starts at it (shared justify-self end/start). */
  .meeting-layout .code-half {
    width: var(--meeting-code-width);
    min-width: 0;
  }
  .meeting-layout .viz-panel {
    width: var(--meeting-viz-width);
    min-width: 0;
  }
  .meeting-layout .code-stack,
  .meeting-layout .step-info,
  .meeting-layout .code-panel,
  .meeting-layout .var-bar,
  .meeting-layout .card {
    width: 100%;
    min-width: 0;
  }
  .meeting-layout .code-block { overflow-x: auto; }
  .code-token.hot {
    background: rgba(249,203,66,0.38);
    border-radius: 4px;
    padding: 1px 3px;
  }
  .code-note {
    display: inline-flex;
    align-items: center;
    min-height: 18px;
    margin-left: 12px;
    padding: 2px 7px;
    border-radius: 6px;
    background: #f5f5f5;
    color: #666;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 11px;
    line-height: 14px;
    vertical-align: middle;
    white-space: nowrap;
  }
  .code-note:empty {
    display: none;
  }
  .code-note.active {
    background: rgba(249,203,66,0.42);
    color: #5B4100;
  }
  /* 13-15 行的说明 2026-08-26 从彩色 pill 改成 # 注释（.cm 绿），
     false-path / true-path 两档配色随之退场 */
  .meeting-layout .step-info {
    min-height: 48px;
    padding: 8px 14px;
  }
  .meeting-layout .var-row {
    white-space: nowrap;
  }

  .interval-lane {
    display: grid;
    grid-template-columns: var(--meeting-label-width) minmax(0, 1fr);
    gap: 10px;
    align-items: center;
    margin-bottom: 12px;
  }
  .lane-label {
    font-family: 'SF Mono', 'Menlo', monospace;
    font-size: 12px;
    color: #777;
    text-align: right;
    white-space: nowrap;
  }
  .lane-track {
    position: relative;
    height: 28px;
    border-radius: 8px;
    background: #f5f5f5;
    overflow: hidden;
  }
  .meeting-block {
    position: absolute;
    top: 5px;
    height: 18px;
    border-radius: 6px;
    background: rgba(139,133,212,0.28);
    border: 1px solid rgba(139,133,212,0.62);
    transition: background 0.2s, border-color 0.2s, transform 0.2s;
  }
  .meeting-block.active {
    background: rgba(249,203,66,0.48);
    border-color: rgba(176,120,0,0.55);
    transform: translateY(-1px);
  }
  .meeting-block.conflict {
    background: rgba(247,140,108,0.44);
    border-color: rgba(196,80,30,0.62);
  }
  .axis {
    display: grid;
    grid-template-columns: var(--meeting-label-width) minmax(0, 1fr);
    gap: 10px;
    align-items: start;
    margin-top: 4px;
  }
  .axis-track {
    position: relative;
    height: 30px;
  }
  .tick {
    position: absolute;
    top: 0;
    transform: translateX(-50%);
    font-family: 'SF Mono', 'Menlo', monospace;
    font-size: 11px;
    color: #999;
  }
  .tick::before {
    content: "";
    display: block;
    width: 1px;
    height: 8px;
    margin: 0 auto 3px;
    background: #ddd;
  }

  .events-split {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 24px;
    align-items: start;
  }
  .event-row {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 106px;
  }
  .events-times-var {
    font-family: 'SF Mono', 'Menlo', monospace;
    font-size: 13px;
    line-height: 30px;
    white-space: nowrap;
    display: grid;
    grid-template-columns: max-content max-content;
    column-gap: 6px;
    align-items: start;
  }
  .times-label {
    color: #9333C0;
  }
  .times-eq {
    color: #007EA8;
    margin-left: 3px;
  }
  .times-list {
    color: #333;
  }
  .times-list-row {
    height: 30px;
    white-space: pre;
  }
  .event-line {
    display: flex;
    gap: 8px;
    min-height: 30px;
    align-items: center;
  }
  .event-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    min-height: 30px;
    border-radius: 8px;
    padding: 5px 9px;
    background: #f5f5f5;
    font-family: 'SF Mono', 'Menlo', monospace;
    font-size: 12px;
    color: #333;
    transition: background 0.2s, opacity 0.2s, transform 0.2s;
  }
  .event-pill.active {
    background: rgba(249,203,66,0.46);
    transform: translateY(-1px);
  }
  .event-pill.done { opacity: 0.36; }
  .event-pill.conflict { background: rgba(247,140,108,0.38); }
  .delta-start { color: #9333C0; font-weight: 800; }
  .delta-end { color: #007EA8; font-weight: 800; }

  .count-meter {
    display: grid;
    grid-template-columns: repeat(3, 64px);
    gap: 10px;
    align-items: end;
    min-height: 86px;
  }
  .count-cell {
    height: 64px;
    border-radius: 8px;
    background: #f5f5f5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'SF Mono', 'Menlo', monospace;
    color: #aaa;
    transition: background 0.2s, transform 0.2s, color 0.2s;
  }
  .count-cell.filled {
    background: rgba(139,133,212,0.24);
    color: #1a1a1a;
  }
  .count-cell.conflict {
    background: rgba(247,140,108,0.42);
    color: #1a1a1a;
    transform: scale(1.05);
  }
  .count-num {
    font-size: 22px;
    font-weight: 800;
  }
  .count-caption {
    font-size: 10px;
    margin-top: 3px;
  }
  .count-explain {
    min-height: 38px;
    margin-bottom: 12px;
    border-radius: 8px;
    background: #f5f5f5;
    padding: 8px 10px;
    font-family: 'SF Mono', 'Menlo', monospace;
    font-size: 12px;
    line-height: 1.45;
    color: #555;
  }
  .count-explain strong {
    color: #C4501E;
  }

  .result-box {
    min-height: 34px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'SF Mono', 'Menlo', monospace;
    font-size: 13px;
  }
  .result-pill {
    border-radius: 8px;
    padding: 6px 10px;
    background: #f5f5f5;
    font-weight: 800;
  }
  .result-pill.false { background: rgba(247,140,108,0.38); color: #7A2E16; }
  .result-pill.true { background: rgba(93,202,165,0.36); color: #246B55; }

  @media (max-width: 1500px) {
    .main.layout-grid.meeting-layout {
      grid-template-columns: var(--meeting-code-width);
      width: var(--meeting-code-width);
      justify-content: center;
    }
    .main.layout-grid.meeting-layout .code-half {
      grid-column: 1;
      grid-row: 1;
      justify-self: center;
    }
    .main.layout-grid.meeting-layout .viz-panel {
      grid-column: 1;
      grid-row: 2;
      justify-self: center;
    }
  }
</style>
</head>
<body>
<link rel="stylesheet" href="ink.css">
<script src="catalog.js"></script>
<script src="sidebar.js"></script>
<script src="shared.js?v=copybtn"></script>

<div class="content-wrapper">
<script>
renderHeader({
  title: '252. Meeting Rooms',
  link: 'https://leetcode.com/problems/meeting-rooms/',
  legend: [
    { color: 'rgba(139,133,212,0.28)', label: 'meeting interval' },
    { color: 'rgba(249,203,66,0.46)', label: 'current event' },
    { color: 'rgba(247,140,108,0.38)', label: 'overlap conflict' },
    { color: 'rgba(93,202,165,0.36)', label: 'can attend' },
  ],
});
</script>
<div class="main layout-grid meeting-layout">

  <!-- Code panel. raw: line 12 keeps its code-token wrappers (JS highlights
       them); append: dynamic code-note pills after lines 11-12, static
       #-comments (.cm) after lines 13-15. -->
  <script>
  renderCodeBox({
    code: `
class Solution:
    def canAttendMeetings(self, intervals: List[List[int]]) -> bool:
        times = []
        for inter in intervals:
            times.append((inter[0], 1))   # start +1
            times.append((inter[1], -1))  # end -1

        times.sort()

        count = 0
        for t in times:
            count += t[1]
            if count > 1:
                return False
        return True`,
    raw: {
      12: '            <span class="code-token" data-token="count"><span class="va">count</span></span> <span class="op">+=</span> <span class="code-token" data-token="t-delta"><span class="va">t</span><span class="op">[</span><span class="nu">1</span><span class="op">]</span></span>',
    },
    append: {
      11: '<span class="code-note" id="line11-note"></span>',
      12: '<span class="code-note" id="line12-note"></span>',
      13: '<span class="cm">  # count &gt; 1 means overlap</span>',
      14: '<span class="cm">  # overlap found: cannot attend all</span>',
      15: '<span class="cm">  # no overlap after scanning all events</span>',
    },
  });
  </script>

  <div class="viz-panel">
    <div class="var-bar" id="var-bar">
      <span class="var-row"></span>
      <span class="var-row"></span>
      <span class="var-row"></span>
    </div>

    <div class="card">
      <h3>Input Intervals  intervals = [[0, 30], [5, 10], [15, 20]]</h3>
      <div id="intervals"></div>
      <div class="axis">
        <div></div>
        <div class="axis-track" id="axis"></div>
      </div>
    </div>

    <div class="card">
      <h3>Sweep Events  times</h3>
      <div class="events-split">
        <div class="events-times-var" id="events-times-var"></div>
        <div class="event-row" id="events"></div>
      </div>
    </div>

    <div class="card">
      <h3>Active Meetings  count</h3>
      <div class="count-explain" id="count-explain"></div>
      <div class="count-meter" id="count-meter"></div>
    </div>

    <div class="card">
      <h3>Return Value</h3>
      <div class="result-box" id="result-box"></div>
    </div>
  </div>
</div>
</div>

<script>
const INTERVALS = [[0, 30], [5, 10], [15, 20]];
const RAW_EVENTS = INTERVALS.flatMap(([start, end], idx) => [
  { time: start, delta: 1, type: 'start', interval: idx },
  { time: end, delta: -1, type: 'end', interval: idx },
]);
const SORTED_EVENTS = [...RAW_EVENTS].sort((a, b) => a.time - b.time || a.delta - b.delta);
const MIN_TIME = 0;
const MAX_TIME = 30;

function eventText(e) {
  return `(${e.time}, ${e.delta})`;
}

function formatEvents(events) {
  if (!events.length) return '[]';
  return `[${events.map(eventText).join(', ')}]`;
}

function buildSteps() {
  const steps = [];
  let times = [];
  let count = null;
  let loopInterval = null;
  let activeEvent = null;
  let processed = -1;
  let result = null;
  let sorted = false;
  let conflictIntervals = [];
  let countBefore = null;
  let countDelta = null;

  function snap(line, info) {
    steps.push({
      line,
      info,
      times: [...times],
      count,
      loopInterval,
      activeEvent,
      processed,
      result,
      sorted,
      conflictIntervals: [...conflictIntervals],
      countBefore,
      countDelta,
    });
  }

  snap(3, 'times = []  (store every start/end as a sweep-line event)');

  INTERVALS.forEach((inter, idx) => {
    loopInterval = idx;
    snap(4, `inter = [${inter[0]}, ${inter[1]}]  (read meeting ${idx})`);
    times.push({ time: inter[0], delta: 1, type: 'start', interval: idx });
    snap(5, `append (${inter[0]}, 1): meeting ${idx} starts, active count will increase`);
    times.push({ time: inter[1], delta: -1, type: 'end', interval: idx });
    snap(6, `append (${inter[1]}, -1): meeting ${idx} ends, active count will decrease`);
  });

  loopInterval = null;
  times = [...SORTED_EVENTS];
  sorted = true;
  snap(8, `sort by (time, delta): ends (-1) come before starts (+1) at the same time`);

  count = 0;
  snap(10, 'count = 0  (no meetings are currently active)');

  for (let idx = 0; idx < times.length; idx++) {
    const event = times[idx];
    activeEvent = idx;
    countBefore = null;
    countDelta = null;
    snap(11, `t = ${eventText(event)}  (${event.type} of meeting ${event.interval})`);

    const before = count;
    count += event.delta;
    countBefore = before;
    countDelta = event.delta;
    processed = idx;
    snap(12, `count += ${event.delta}  →  ${before} ${event.delta >= 0 ? '+' : '-'} ${Math.abs(event.delta)} = ${count}`);

    if (count > 1) {
      conflictIntervals = activeIntervalsAfter(idx);
      snap(13, `count = ${count} > 1  →  two meetings overlap`);
      result = false;
      snap(14, 'return False  (cannot attend all meetings)');
      return steps;
    }
    snap(13, `count = ${count} ≤ 1  →  no overlap so far`);
  }

  activeEvent = null;
  result = true;
  snap(15, 'return True  (the sweep never found count > 1)');
  return steps;
}

function activeIntervalsAfter(eventIndex) {
  const active = new Set();
  for (let idx = 0; idx <= eventIndex; idx++) {
    const e = SORTED_EVENTS[idx];
    if (e.delta === 1) active.add(e.interval);
    else active.delete(e.interval);
  }
  return [...active];
}

const STEPS = buildSteps();
let cur = -1;

function xPct(t) {
  return ((t - MIN_TIME) / (MAX_TIME - MIN_TIME)) * 100;
}

function renderVarBar(state) {
  const empty = '<span class="var-row"></span>';
  if (!state) {
    document.getElementById('var-bar').innerHTML = empty.repeat(3);
    return;
  }

  const current = state.activeEvent !== null && state.sorted ? SORTED_EVENTS[state.activeEvent] : null;
  const rows = [
    `<span class="var-row"><span class="var-name">times</span><span class="var-eq"> = </span><span style="color:#333;">${formatEvents(state.times)}</span></span>`,
    state.count !== null
      ? `<span class="var-row"><span class="var-name">count</span><span class="var-eq"> = </span><span class="var-val">${state.count}</span></span>`
      : empty,
    current
      ? `<span class="var-row"><span class="var-name">t</span><span class="var-eq"> = </span><span class="var-val">${eventText(current)}</span></span>`
      : empty,
  ];
  document.getElementById('var-bar').innerHTML = rows.join('');
}

function buildIntervalDOM() {
  const wrap = document.getElementById('intervals');
  wrap.innerHTML = '';
  INTERVALS.forEach(([start, end], idx) => {
    const lane = document.createElement('div');
    lane.className = 'interval-lane';

    const label = document.createElement('div');
    label.className = 'lane-label';
    label.textContent = `[${start}, ${end}]`;
    lane.appendChild(label);

    const track = document.createElement('div');
    track.className = 'lane-track';
    const block = document.createElement('div');
    block.className = 'meeting-block';
    block.id = `interval-${idx}`;
    block.style.left = `${xPct(start)}%`;
    block.style.width = `${Math.max(5, xPct(end) - xPct(start))}%`;
    track.appendChild(block);
    lane.appendChild(track);
    wrap.appendChild(lane);
  });

  const axis = document.getElementById('axis');
  axis.innerHTML = '';
  [0, 5, 10, 15, 20, 30].forEach(t => {
    const tick = document.createElement('div');
    tick.className = 'tick';
    tick.style.left = `${xPct(t)}%`;
    tick.textContent = t;
    axis.appendChild(tick);
  });
}

function renderEvents(state) {
  const holder = document.getElementById('events');
  const timesVar = document.getElementById('events-times-var');
  const events = state && state.sorted ? SORTED_EVENTS : (state ? state.times : []);
  if (timesVar) {
    timesVar.innerHTML = renderTimesVariable(events);
  }
  if (!events.length) {
    holder.innerHTML = `<span style="font-size:12px;color:#aaa;font-family:'SF Mono',monospace;">times = []</span>`;
    return;
  }

  function renderPill(e, idx) {
    let cls = 'event-pill';
    if (state && state.sorted && idx === state.activeEvent) cls += ' active';
    if (state && state.sorted && idx <= state.processed) cls += ' done';
    if (state && state.conflictIntervals.includes(e.interval)) cls += ' conflict';
    const deltaCls = e.delta === 1 ? 'delta-start' : 'delta-end';
    const sign = e.delta === 1 ? '+1' : '-1';
    return `<span class="${cls}"><span>${e.time}</span><span class="${deltaCls}">${sign}</span></span>`;
  }

  holder.innerHTML = INTERVALS.map((_, intervalIdx) => {
    const rowEvents = events
      .map((e, idx) => ({ e, idx }))
      .filter(item => item.e.interval === intervalIdx)
      .sort((a, b) => a.e.time - b.e.time);
    return `<div class="event-line">${rowEvents.map(item => renderPill(item.e, item.idx)).join('')}</div>`;
  }).join('');
}

function renderTimesVariable(events) {
  if (!events.length) {
    return `<span><span class="times-label">times</span><span class="times-eq">=</span></span><span class="times-list">[]</span>`;
  }

  const rows = INTERVALS.map((_, intervalIdx) => {
    const rowEvents = events
      .filter(e => e.interval === intervalIdx)
      .sort((a, b) => a.time - b.time);
    if (!rowEvents.length) return '';
    return rowEvents.map(eventText).join(', ');
  });
  const nonEmptyRows = rows.filter(Boolean);

  return `<span><span class="times-label">times</span><span class="times-eq">=</span></span>` +
    `<div class="times-list">` +
      nonEmptyRows.map((row, idx) => {
        const prefix = idx === 0 ? '[' : ' ';
        const suffix = idx === nonEmptyRows.length - 1 ? ']' : ',';
        return `<div class="times-list-row">${prefix}${row}${suffix}</div>`;
      }).join('') +
    `</div>`;
}

function renderIntervals(state) {
  INTERVALS.forEach((_, idx) => {
    const block = document.getElementById(`interval-${idx}`);
    let cls = 'meeting-block';
    if (state && state.loopInterval === idx) cls += ' active';
    if (state && state.sorted && state.activeEvent !== null && SORTED_EVENTS[state.activeEvent].interval === idx) cls += ' active';
    if (state && state.conflictIntervals.includes(idx)) cls += ' conflict';
    block.className = cls;
  });
}

function renderCount(state) {
  const meter = document.getElementById('count-meter');
  const explain = document.getElementById('count-explain');
  const count = state && state.count !== null ? state.count : 0;
  if (explain) {
    explain.innerHTML = renderCountExplain(state);
  }
  meter.innerHTML = [1, 2, 3].map(n => {
    let cls = 'count-cell';
    if (count >= n) cls += ' filled';
    if (count > 1 && count >= n) cls += ' conflict';
    return `<div class="${cls}"><div class="count-num">${n}</div><div class="count-caption">${n === 1 ? 'ok' : 'overlap'}</div></div>`;
  }).join('');
}

function renderCountExplain(state) {
  if (!state || state.count === null) {
    return 'count tracks how many meetings are active right now.';
  }
  if (state.activeEvent !== null && state.countBefore !== null) {
    const e = SORTED_EVENTS[state.activeEvent];
    const action = e.delta === 1 ? 'start event' : 'end event';
    return `t = <strong>${eventText(e)}</strong> (${action}); count = ${state.countBefore} + (${e.delta}) = <strong>${state.count}</strong>`;
  }
  return `count = <strong>${state.count}</strong>; this is the number of meetings active at the current sweep time.`;
}

function renderCodeAnnotations(state) {
  const line11 = document.getElementById('line11-note');
  const line12 = document.getElementById('line12-note');
  document.querySelectorAll('.code-token').forEach(el => el.classList.remove('hot'));
  if (line11) {
    line11.textContent = '';
    line11.classList.remove('active');
  }
  if (line12) {
    line12.textContent = '';
    line12.classList.remove('active');
  }
  if (!state || state.activeEvent === null) return;

  const e = SORTED_EVENTS[state.activeEvent];
  if (line11) {
    line11.textContent = `current t = ${eventText(e)}`;
    line11.classList.add('active');
  }
  if (state.line === 12 || state.countBefore !== null) {
    document.querySelectorAll('[data-token="count"], [data-token="t-delta"]').forEach(el => el.classList.add('hot'));
  }
  if (line12 && state.countBefore !== null) {
    line12.textContent = `t[1] = ${e.delta}; count: ${state.countBefore} → ${state.count}`;
    line12.classList.add('active');
  }
}

function renderResult(state) {
  const box = document.getElementById('result-box');
  if (!state || state.result === null) {
    box.innerHTML = `<span style="color:#aaa;">waiting...</span>`;
    return;
  }
  const text = state.result ? 'True' : 'False';
  const cls = state.result ? 'true' : 'false';
  box.innerHTML = `<span class="result-pill ${cls}">${text}</span><span>${state.result ? 'all meetings fit' : 'overlap found'}</span>`;
}

function render() {
  if (cur < 0) {
    renderVarBar(null);
    renderEvents(null);
    renderIntervals(null);
    renderCount(null);
    renderResult(null);
    renderCodeAnnotations(null);
    renderCtrl(-1, STEPS.length, '');
    highlightLine(null);
    return;
  }

  const state = STEPS[cur];
  highlightLine(state.line);
  renderCtrl(cur, STEPS.length, state.info);
  renderVarBar(state);
  renderEvents(state);
  renderIntervals(state);
  renderCount(state);
  renderResult(state);
  renderCodeAnnotations(state);
}

buildIntervalDOM();
doReset();
</script>
</body>
</html>
