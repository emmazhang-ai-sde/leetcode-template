<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>104. Maximum Depth of Binary Tree</title>
<link rel="stylesheet" href="shared.css?v=info-hud">
<style>
  svg { display: block; width: 100%; max-height: 240px; }

  /* Call stack (recursion frames) */
  .frame-stack-container { display: flex; flex-direction: column-reverse; align-items: center; gap: 4px; min-height: 190px; justify-content: flex-start; padding: 8px 0; }
  .frame-cell { min-width: 96px; height: 32px; padding: 0 10px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: 'SF Mono', monospace; font-size: 12.5px; font-weight: 700; background: rgba(139,133,212,0.22); color: #1a1a1a; transition: all 0.2s; }
  .frame-cell.top { background: rgba(249,203,66,0.5); }
  .frame-cell.none-frame { color: #999; font-weight: 600; background: #f0f0f0; }
  .frame-cell.resolved { background: rgba(93,202,165,0.45); }
  .frame-stack-base { width: 108px; height: 3px; background: #ccc; border-radius: 2px; margin-top: 4px; }
  .stack-empty { font-size: 12px; color: #aaa; font-family: 'SF Mono', monospace; }

  /* Single-value answer cell */
  .res-row { display: flex; }
  .res-cell { width: 44px; height: 44px; border-radius: 8px; margin: 0 3px; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; font-family: 'SF Mono', monospace; background: #f5f5f5; color: #bbb; transition: background 0.2s, color 0.2s, transform 0.15s; }
  .res-cell.filled { background: rgba(93,202,165,0.3); color: #1a1a1a; }
  .res-cell.newest { background: rgba(93,202,165,0.55); transform: scale(1.08); }

  .stack-result-row { display: flex; gap: 16px; align-items: stretch; }
  .stack-result-row .card { display: flex; flex-direction: column; align-items: center; }
  .stack-result-row .card:last-child { align-items: flex-start; justify-content: flex-start; }

  /* Inline variable readouts, anchored under the block they describe */
  .node-vars { margin-top: 8px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-family: 'SF Mono', 'Menlo', monospace; font-size: 13px; }
  .depth-var-row { margin-top: 8px; text-align: center; font-family: 'SF Mono', 'Menlo', monospace; font-size: 13px; }
  .res-label { margin: 12px 0 0; }
</style>
</head>
<body>
<link rel="stylesheet" href="ink.css">
<script src="catalog.js"></script>
<script src="sidebar.js"></script>
<script src="shared.js?v=copybtn"></script>

<div class="content-wrapper">
<script>
renderHeader({
  title: '104. Maximum Depth of Binary Tree',
  link: 'https://leetcode.com/problems/maximum-depth-of-binary-tree/',
  legend: [
    { color: 'rgba(249,203,66,0.55)', label: '栈顶 — maxDepth(node) 正在执行' },
    { color: 'rgba(93,202,165,0.4)', label: '已合并完成 — 深度已算出' },
    { color: '#f5f5f5', extra: 'border:1px solid #ccc;', label: '尚未访问' },
    { color: '#3A6FD4', extra: 'border-radius:2px;width:14px;height:3px;', label: '正在下探的边' },
  ],
});
</script>
<div class="main layout-grid">
  <script>
  renderCodeBox({
    prereq: `
# Definition for a binary tree node.
# class TreeNode:
#     def __init__(self, val=0, left=None, right=None):
#         self.val = val
#         self.left = left
#         self.right = right`,
    code: `
class Solution:
    def maxDepth(self, root: Optional[TreeNode]) -> int:
        if not root:
            return 0

        left_depth = self.maxDepth(root.left)
        right_depth = self.maxDepth(root.right)

        return max(left_depth, right_depth) + 1`,
  });
  </script>

  <div class="viz-panel">
    <div class="card">
      <h3>Binary Tree</h3>
      <svg id="tree-svg" viewBox="0 0 360 250"></svg>
      <div class="node-vars" id="node-vars"></div>
    </div>

    <div class="stack-result-row">
      <div class="card">
        <h3>Call Stack（递归栈）</h3>
        <div class="frame-stack-container" id="frame-stack">
          <span class="stack-empty">尚未调用 maxDepth()</span>
        </div>
        <div class="frame-stack-base"></div>
        <div style="font-size:11px;color:#aaa;margin-top:4px;">bottom</div>
        <div class="depth-var-row" id="depth-var"></div>
      </div>

      <div class="card">
        <div class="res-row" id="answer-row"></div>
        <h3 class="res-label">answer = maxDepth(1)</h3>
      </div>
    </div>
  </div>
</div><!-- /.main -->
</div><!-- /.content-wrapper -->

<script>
// ── Tree definition ──────────────────────────────────────────────────────
//        1
//       / \
//      2   3
//     / \
//    4   5
const TREE = {
  1: { left: 2, right: 3 },
  2: { left: 4, right: 5 },
  3: { left: null, right: null },
  4: { left: null, right: null },
  5: { left: null, right: null },
};
const POS = {
  1: { x: 180, y: 36 },
  2: { x: 100, y: 116 },
  3: { x: 260, y: 116 },
  4: { x: 60,  y: 196 },
  5: { x: 140, y: 196 },
};
const EDGES = [[1,2],[1,3],[2,4],[2,5]];

// data-l line numbers (prereq occupies 1-6, main code continues from 7)
const L = { CHECK: 9, RETURN0: 10, LEFT_CALL: 12, RIGHT_CALL: 13, COMBINE: 15 };

// ── Build steps by simulating the recursion (divide → conquer → combine) ──
function buildSteps() {
  const steps = [];
  let stack = [];    // frame objects: { node, leftDepth, rightDepth, result }
  let depths = {};   // nodeVal -> computed max depth, once its call has returned
  let activeEdge = null;

  function cloneStack() { return stack.map(f => ({ ...f })); }
  function snap(line, info) {
    steps.push({ line, info, stack: cloneStack(), depths: { ...depths }, activeEdge });
  }

  snap(null, '点击 Next 开始：调用 maxDepth(root)，root 指向节点 1。');

  function dfs(nodeVal) {
    const frame = { node: nodeVal, leftDepth: null, rightDepth: null, result: null };
    stack.push(frame);

    if (nodeVal === null) {
      snap(L.CHECK, '进入 maxDepth(None)。Line 9: not root → True。');
      activeEdge = null;
      snap(L.RETURN0, 'Line 10: return 0 — 空节点深度为 0。');
      stack.pop();
      return 0;
    }

    activeEdge = null;
    snap(L.CHECK, `进入 maxDepth(${nodeVal})。Line 9: root=${nodeVal} 存在 → 条件 False，继续执行。`);

    const { left, right } = TREE[nodeVal];

    activeEdge = left != null ? [nodeVal, left] : null;
    snap(L.LEFT_CALL, `Line 12: left_depth = self.maxDepth(root.left) → ${left != null ? `调用 maxDepth(${left})` : '左子节点为 None，调用 maxDepth(None)'}`);
    const leftVal = dfs(left);
    activeEdge = null;
    frame.leftDepth = leftVal;
    snap(L.LEFT_CALL, `递归返回，left_depth = ${leftVal}`);

    activeEdge = right != null ? [nodeVal, right] : null;
    snap(L.RIGHT_CALL, `Line 13: right_depth = self.maxDepth(root.right) → ${right != null ? `调用 maxDepth(${right})` : '右子节点为 None，调用 maxDepth(None)'}`);
    const rightVal = dfs(right);
    activeEdge = null;
    frame.rightDepth = rightVal;
    snap(L.RIGHT_CALL, `递归返回，right_depth = ${rightVal}`);

    const result = Math.max(leftVal, rightVal) + 1;
    frame.result = result;
    depths[nodeVal] = result;
    snap(L.COMBINE, `Line 15: return max(${leftVal}, ${rightVal}) + 1 = ${result} — 合并左右子树深度，取更大的一边 +1。`);

    stack.pop();
    return result;
  }

  const answer = dfs(1);
  snap(null, `✅ maxDepth(1) 计算完成，最终答案 = ${answer}。`);

  return steps;
}

const STEPS = buildSteps();
let cur = -1;

// ── Rendering ─────────────────────────────────────────────────────────────
function renderTree(step) {
  const svg = document.getElementById('tree-svg');
  svg.innerHTML = '';
  function mkEl(tag) { return document.createElementNS('http://www.w3.org/2000/svg', tag); }

  for (const [a, b] of EDGES) {
    const pa = POS[a], pb = POS[b];
    const isActive = step.activeEdge && step.activeEdge[0] === a && step.activeEdge[1] === b;
    const line = mkEl('line');
    line.setAttribute('x1', pa.x); line.setAttribute('y1', pa.y);
    line.setAttribute('x2', pb.x); line.setAttribute('y2', pb.y);
    line.setAttribute('stroke', isActive ? '#3A6FD4' : '#c8c6be');
    line.setAttribute('stroke-width', isActive ? '3' : '1.5');
    svg.appendChild(line);
  }

  const activeNode = (step.stack.length && step.stack[step.stack.length - 1].node !== null)
    ? step.stack[step.stack.length - 1].node : null;

  for (const id of [1, 2, 3, 4, 5]) {
    const p = POS[id];
    const isDone = step.depths[id] !== undefined;
    let fill = '#f5f5f5', stroke = '#c9c9c9', strokeW = 1.5;
    if (id === activeNode) { fill = 'rgba(249,203,66,0.55)'; stroke = '#d4a800'; strokeW = 2.5; }
    else if (isDone) { fill = 'rgba(93,202,165,0.4)'; stroke = '#1D9E75'; strokeW = 1.5; }

    const g = mkEl('g');
    const circle = mkEl('circle');
    circle.setAttribute('cx', p.x); circle.setAttribute('cy', p.y); circle.setAttribute('r', 22);
    circle.setAttribute('fill', fill); circle.setAttribute('stroke', stroke); circle.setAttribute('stroke-width', strokeW);
    g.appendChild(circle);

    const text = mkEl('text');
    text.setAttribute('x', p.x); text.setAttribute('y', p.y);
    text.setAttribute('text-anchor', 'middle'); text.setAttribute('dominant-baseline', 'central');
    text.setAttribute('font-size', '14'); text.setAttribute('font-weight', '700'); text.setAttribute('fill', '#1a1a1a');
    text.setAttribute('font-family', 'SF Mono, Menlo, monospace');
    text.textContent = id;
    g.appendChild(text);

    if (isDone) {
      const badge = mkEl('text');
      badge.setAttribute('x', p.x); badge.setAttribute('y', p.y + 34);
      badge.setAttribute('text-anchor', 'middle'); badge.setAttribute('font-size', '10.5');
      badge.setAttribute('font-weight', '700'); badge.setAttribute('fill', '#1D9E75');
      badge.setAttribute('font-family', 'SF Mono, monospace');
      badge.textContent = `d=${step.depths[id]}`;
      g.appendChild(badge);
    }

    svg.appendChild(g);
  }
}

function renderCallStack(stack) {
  const el = document.getElementById('frame-stack');
  if (!stack.length) {
    el.innerHTML = '<span class="stack-empty">尚未调用 maxDepth()</span>';
    return;
  }
  el.innerHTML = stack.map((f, i) => {
    const isTop = i === stack.length - 1;
    const isNone = f.node === null;
    const label = isNone ? 'maxDepth(None)' : `maxDepth(${f.node})`;
    const resolved = f.result !== null;
    const suffix = resolved ? ` = ${f.result}` : '';
    return `<div class="frame-cell${isTop ? ' top' : ''}${isNone ? ' none-frame' : ''}${resolved ? ' resolved' : ''}">${label}${suffix}</div>`;
  }).join('');
}

function renderAnswerRow(step) {
  const answer = step.depths[1];
  const filled = answer !== undefined;
  document.getElementById('answer-row').innerHTML =
    `<div class="res-cell${filled ? ' filled newest' : ''}">${filled ? answer : '?'}</div>`;
}

function renderNodeVars(step) {
  const top = step.stack.length ? step.stack[step.stack.length - 1] : null;
  const rootDisplay = !top ? '—' : (top.node === null ? 'None' : top.node);
  const leftDisplay = top && top.leftDepth !== null ? top.leftDepth : '·';
  const rightDisplay = top && top.rightDepth !== null ? top.rightDepth : '·';
  document.getElementById('node-vars').innerHTML =
    `<div><span class="var-name">root</span><span class="var-eq"> = </span><span class="var-val">${rootDisplay}</span></div>` +
    `<div><span class="var-name">left_depth</span><span class="var-eq"> = </span><span class="var-val">${leftDisplay}</span></div>` +
    `<div><span class="var-name">right_depth</span><span class="var-eq"> = </span><span class="var-val">${rightDisplay}</span></div>`;
}

function renderDepthVar(step) {
  document.getElementById('depth-var').innerHTML =
    `<span class="var-name">stack depth</span><span class="var-eq"> = </span><span class="var-val">${step.stack.length}</span>`;
}

function renderAll() {
  const step = cur >= 0 ? STEPS[cur] : null;
  const empty = { stack: [], depths: {}, activeEdge: null };

  if (!step) {
    renderTree(empty);
    renderCallStack([]);
    renderAnswerRow(empty);
    renderNodeVars(empty);
    renderDepthVar(empty);
    renderCtrl(-1, STEPS.length, '');
    highlightLine(null);
    return;
  }

  renderTree(step);
  renderCallStack(step.stack);
  renderAnswerRow(step);
  renderNodeVars(step);
  renderDepthVar(step);
  highlightLine(step.line);
  renderCtrl(cur, STEPS.length, step.info);
}

var render = renderAll;
doReset();
</script>
</body>
</html>
