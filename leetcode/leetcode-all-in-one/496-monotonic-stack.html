<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>496. Next Greater Element I — Monotonic Stack</title>
<link rel="stylesheet" href="shared.css?v=info-hud">
<style>
  .code-block { }
  .code-line.hl { background: rgba(199,146,234,0.18); }
  .viz-panel { gap: 14px; }
  .ctrl { margin-bottom: 10px; }
  .leg-box { width: 13px; height: 13px; border-radius: 3px; }
  .cm { font-style: italic; }
  .scan-map-layout { display: grid; grid-template-columns: minmax(180px, 1fr) max-content; gap: 14px; align-items: stretch; }
  .scan-map-right { display: flex; flex-direction: column; gap: 14px; }
  .stack-card { display: flex; flex-direction: column; align-items: center; height: 100%; }

  /* Cells */
  .cell-group { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .cell { width: 44px; height: 44px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; font-family: 'SF Mono', monospace; background: #f5f5f5; color: #1a1a1a; transition: background 0.2s, transform 0.15s, opacity 0.2s; margin: 0 3px; }
  .cell.active   { background: rgba(249,203,66,0.45); transform: scale(1.08); }
  .cell.scanned  { opacity: 0.3; }
  .cell.in-stack { background: rgba(139,133,212,0.25); }
  .cell.popping  { background: rgba(93,202,165,0.45); transform: scale(1.1); }
  .cell.querying { background: rgba(249,203,66,0.35); }
  .cell.done     { background: rgba(247,140,108,0.18); opacity: 0.55; }
  .cell-idx { font-size: 10px; color: #aaa; font-family: 'SF Mono', monospace; }

  /* Pointer row */
  .ptr-row { display: flex; margin-top: 4px; }
  .ptr-cell { width: 44px; margin: 0 3px; display: flex; justify-content: center; font-size: 12px; font-weight: 700; color: #9333C0; }

  /* Stack */
  .stack-container { display: flex; flex: 1; flex-direction: column-reverse; align-items: center; gap: 4px; min-height: 180px; justify-content: flex-start; padding: 8px 0; }
  .stack-cell { width: 64px; height: 44px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; font-family: 'SF Mono', monospace; background: rgba(139,133,212,0.2); color: #1a1a1a; transition: all 0.25s; position: relative; }
  .stack-cell.top     { background: rgba(139,133,212,0.4); }
  .stack-cell.popping { background: rgba(93,202,165,0.45); transform: translateX(8px); }
  .stack-cell.pushing { background: rgba(249,203,66,0.4); }
  .stack-label { font-size: 10px; color: #8B85D4; font-weight: 600; position: absolute; right: -28px; top: 50%; transform: translateY(-50%); }
  .stack-empty { font-size: 12px; color: #aaa; font-family: 'SF Mono', monospace; }
  .stack-base { width: 80px; height: 3px; background: #ccc; border-radius: 2px; margin-top: 4px; }

  /* Maps dict */
  .maps-table { display: flex; flex-direction: column; gap: 6px; }
  .maps-row { display: flex; align-items: center; gap: 10px; font-family: 'SF Mono', monospace; font-size: 13px; }
  .maps-row.placeholder { visibility: hidden; }
  .maps-key { width: 28px; height: 28px; border-radius: 6px; background: #f0f0f0; display: flex; align-items: center; justify-content: center; font-weight: 700; }
  .maps-arrow { color: #aaa; }
  .maps-val { width: 36px; height: 28px; border-radius: 6px; background: #f0f0f0; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #aaa; }
  .maps-val.filled  { background: rgba(247,140,108,0.3); color: #1a1a1a; }
  .maps-val.newest  { background: rgba(93,202,165,0.4); color: #1a1a1a; }
  .maps-key.hit     { background: rgba(249,203,66,0.5); }

  /* Result */
  .res-cell { width: 44px; height: 44px; border-radius: 8px; margin: 0 3px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; font-family: 'SF Mono', monospace; background: #f5f5f5; color: #aaa; transition: background 0.2s, color 0.2s; }
  .res-cell.filled { background: rgba(247,140,108,0.25); color: #1a1a1a; }
  .res-cell.newest { background: rgba(247,140,108,0.5); color: #1a1a1a; }
  .array-equation { display: flex; align-items: flex-start; gap: 12px; margin-top: 8px; }
  .array-equation + .array-equation { margin-top: 18px; }
  .array-label { width: 64px; flex-shrink: 0; padding-top: 12px; font-size: 12px; color: #aaa; font-family: 'SF Mono', monospace; font-weight: 700; }
  .array-blocks { display: flex; flex-direction: column; }
</style>
</head>
<body>
<link rel="stylesheet" href="ink.css">
<script src="catalog.js"></script>
<script src="sidebar.js"></script>
<script src="shared.js?v=copybtn"></script>
<div class="content-wrapper">
<script>
renderHeader({
  title: '496. Next Greater Element I — Monotonic Stack Animation',
  legend: [
    { color: 'rgba(249,203,66,0.45)', label: 'current num' },
    { color: 'rgba(139,133,212,0.25)', label: 'in stack' },
    { color: 'rgba(93,202,165,0.45)', label: 'popped — NGE found' },
    { color: '#f0f0f0', extra: 'opacity:0.4;', label: 'already scanned' },
  ],
});
</script>
<div class="main layout-grid">
    <!-- Code panel -->
    <script>
    renderCodeBox({
      code: `
def nextGreaterElement(self, nums1, nums2):
    stack = []
    maps = {}

    # decrease mono stack
    for num in nums2:
        while stack and num > stack[-1]:
            key = stack.pop()
            maps[key] = num
        stack.append(num)

    res = []
    for num in nums1:
        if num not in maps:
            res.append(-1)
        else:
            res.append(maps[num])

    return res`,
    });
    </script>

    <!-- Viz panel -->
    <div class="viz-panel">

      <!-- Vars bar -->
      <div class="var-bar" id="vars-bar"><span class="var-dim">variable state</span></div>

      <!-- Stack + nums2 scan + maps -->
      <div class="scan-map-layout">
        <div class="card stack-card">
          <h3 style="text-align:center; align-self:flex-start;">stack (decreasing)</h3>
          <div style="font-size:11px;color:#8B85D4;margin-bottom:6px;">stack[-1] ↑</div>
          <div class="stack-container" id="stack-area">
            <span class="stack-empty">stack = []</span>
          </div>
          <div class="stack-base"></div>
          <div style="font-size:11px;color:#aaa;margin-top:4px;">bottom</div>
        </div>

        <div class="scan-map-right">
          <div class="card">
            <h3>Scan nums2 — Build maps</h3>
            <div style="font-size:12px;color:#aaa;font-family:'SF Mono',monospace;margin-bottom:8px;">nums2 = [1, 3, 4, 2]</div>
            <div style="display:flex;" id="nums2-row"></div>
            <div style="display:flex;" id="ptr2-row" class="ptr-row"></div>
          </div>

          <div class="card">
            <h3>maps (val → next greater)</h3>
            <div class="maps-table" id="maps-table"></div>
          </div>
        </div>
      </div>

      <!-- nums1 lookup + result -->
      <div class="card">
        <h3>Lookup nums1 in maps → build res</h3>
        <div class="array-equation">
          <div class="array-label">nums1 =</div>
          <div class="array-blocks">
            <div style="display:flex;" id="nums1-row"></div>
            <div style="display:flex;" id="ptr1-row" class="ptr-row"></div>
          </div>
        </div>
        <div class="array-equation">
          <div class="array-label">res =</div>
          <div class="array-blocks">
            <div style="display:flex;" id="result-row"></div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
const NUMS1 = [4, 1, 2];
const NUMS2 = [1, 3, 4, 2];

// ── Step builder ──────────────────────────────────────────────────────────
function buildSteps() {
  const steps = [];

  let stack = [];
  let maps = {};
  let numIdx2 = null;       // current index in nums2 (phase 1)
  let numIdx1 = null;       // current index in nums1 (phase 2)
  let poppingVal = null;
  let keyVal = null;        // the popped key
  let scannedSet2 = new Set();
  let doneSet1 = new Set();
  let res = null;           // null until phase 2 begins
  let newestMapsKey = null;
  let hitKey = null;        // which maps key is being looked up
  let phase = 'scan';       // 'scan' | 'result'

  function snap(line, info) {
    steps.push({
      line, info,
      stack: [...stack],
      maps: {...maps},
      numIdx2,
      numIdx1,
      poppingVal,
      keyVal,
      scannedSet2: new Set(scannedSet2),
      doneSet1: new Set(doneSet1),
      res: res === null ? null : [...res],
      newestMapsKey,
      hitKey,
      phase,
    });
  }

  // Line 1: function entry
  snap(1, 'Line 1: enter nextGreaterElement(nums1, nums2)');

  // Line 2: stack = []
  snap(2, 'Line 2: stack = []');

  // Line 3: maps = {}
  snap(3, 'Line 3: maps = {}');

  // Line 5: comment — decrease mono stack
  snap(5, 'Line 5: # decrease mono stack');

  // Phase 1: scan nums2
  for (let i = 0; i < NUMS2.length; i++) {
    const num = NUMS2[i];
    numIdx2 = i;
    newestMapsKey = null;
    snap(6, `Line 6: for num in nums2 → num = ${num}`);

    // Initial condition check — always show TRUE or FALSE explicitly
    if (stack.length > 0 && num > stack[stack.length - 1]) {
      poppingVal = stack[stack.length - 1];
      snap(7, `Line 7: stack[-1] = ${stack[stack.length-1]} < num(${num}) → TRUE, will pop`);
      poppingVal = null;
    } else {
      snap(7, stack.length === 0
        ? `Line 7: stack is empty → condition FALSE, skip while body`
        : `Line 7: stack[-1] = ${stack[stack.length-1]} ≥ num(${num}) → condition FALSE, skip while body`
      );
    }

    while (stack.length > 0 && num > stack[stack.length - 1]) {
      const top = stack[stack.length - 1];
      stack.pop();
      keyVal = top;
      snap(8, `Line 8: key = stack.pop() → key = ${top}`);
      maps[top] = num;
      newestMapsKey = top;
      snap(9, `Line 9: maps[${top}] = ${num}`);
      keyVal = null;
      newestMapsKey = null;

      // Re-check condition after each pop — always show TRUE or FALSE
      if (stack.length > 0 && num > stack[stack.length - 1]) {
        poppingVal = stack[stack.length - 1];
        snap(7, `Line 7: check again — stack[-1] = ${stack[stack.length-1]} < num(${num}) → TRUE, will pop`);
        poppingVal = null;
      } else {
        snap(7, stack.length === 0
          ? `Line 7: check again — stack is empty → condition FALSE, exit while`
          : `Line 7: check again — stack[-1] = ${stack[stack.length-1]} ≥ num(${num}) → condition FALSE, exit while`
        );
      }
    }
    poppingVal = null; keyVal = null;

    // Push
    stack.push(num);
    newestMapsKey = null;
    snap(10, `Line 10: stack.append(${num}) → stack = [${stack.join(', ')}]`);
    scannedSet2.add(i);
  }

  numIdx2 = null;

  // Phase 2: build res
  phase = 'result';
  res = [];
  snap(12, `Line 12: Phase 1 complete. maps = ${JSON.stringify(maps)}. Now res = []`);

  for (let i = 0; i < NUMS1.length; i++) {
    const num = NUMS1[i];
    numIdx1 = i;
    hitKey = null;
    snap(13, `Line 13: for num in nums1 → num = ${num}`);

    snap(14, `Line 14: is ${num} not in maps? → ${!(num in maps) ? 'YES (no NGE)' : 'NO (found in maps)'}`);
    if (!(num in maps)) {
      res.push(-1);
      snap(15, `Line 15: res.append(-1)  — ${num} has no next greater element`);
    } else {
      hitKey = num;
      snap(17, `Line 17: res.append(maps[${num}]) = ${maps[num]}`);
      res.push(maps[num]);
      hitKey = null;
    }

    doneSet1.add(i);
  }

  numIdx1 = null;
  snap(19, `Line 19: return res = [${res.join(', ')}] ✓`);

  return steps;
}

const STEPS = buildSteps();
const FINAL_MAP_ROW_COUNT = Math.max(...STEPS.map(s => Object.keys(s.maps).length));
let cur = -1;

// ── Build DOM ─────────────────────────────────────────────────────────────
function buildDOM() {
  // nums2 row
  const n2row = document.getElementById('nums2-row');
  n2row.innerHTML = '';
  NUMS2.forEach((val, i) => {
    const g = document.createElement('div');
    g.className = 'cell-group';
    const c = document.createElement('div');
    c.className = 'cell'; c.id = `n2-${i}`; c.textContent = val;
    const idx = document.createElement('div');
    idx.className = 'cell-idx'; idx.textContent = `[${i}]`;
    g.appendChild(c); g.appendChild(idx);
    n2row.appendChild(g);
  });

  // ptr2 row
  const p2row = document.getElementById('ptr2-row');
  p2row.innerHTML = '';
  NUMS2.forEach((_, i) => {
    const pc = document.createElement('div');
    pc.className = 'ptr-cell'; pc.id = `ptr2-${i}`;
    p2row.appendChild(pc);
  });

  // nums1 row
  const n1row = document.getElementById('nums1-row');
  n1row.innerHTML = '';
  NUMS1.forEach((val, i) => {
    const g = document.createElement('div');
    g.className = 'cell-group';
    const c = document.createElement('div');
    c.className = 'cell'; c.id = `n1-${i}`; c.textContent = val;
    const idx = document.createElement('div');
    idx.className = 'cell-idx'; idx.textContent = `[${i}]`;
    g.appendChild(c); g.appendChild(idx);
    n1row.appendChild(g);
  });

  // ptr1 row
  const p1row = document.getElementById('ptr1-row');
  p1row.innerHTML = '';
  NUMS1.forEach((_, i) => {
    const pc = document.createElement('div');
    pc.className = 'ptr-cell'; pc.id = `ptr1-${i}`;
    p1row.appendChild(pc);
  });

  // result row
  const rrow = document.getElementById('result-row');
  rrow.innerHTML = '';
  NUMS1.forEach((_, i) => {
    const g = document.createElement('div');
    g.className = 'cell-group';
    const c = document.createElement('div');
    c.className = 'res-cell'; c.id = `res-${i}`; c.textContent = '?';
    const idx = document.createElement('div');
    idx.className = 'cell-idx'; idx.textContent = `[${i}]`;
    g.appendChild(c); g.appendChild(idx);
    rrow.appendChild(g);
  });
}

function appendMapRow(parent, key, val, { hit = false, newest = false, placeholder = false } = {}) {
  const row = document.createElement('div');
  row.className = 'maps-row' + (placeholder ? ' placeholder' : '');

  const keyEl = document.createElement('div');
  keyEl.className = 'maps-key' + (hit ? ' hit' : '');
  keyEl.textContent = key;

  const arr = document.createElement('span');
  arr.className = 'maps-arrow';
  arr.textContent = '→';

  const valEl = document.createElement('div');
  valEl.className = 'maps-val filled' + (newest ? ' newest' : '');
  valEl.textContent = val;

  row.appendChild(keyEl);
  row.appendChild(arr);
  row.appendChild(valEl);
  parent.appendChild(row);
}

function renderMapsTable(s) {
  const mapsTable = document.getElementById('maps-table');
  const keys = Object.keys(s.maps);
  mapsTable.innerHTML = '';

  keys.forEach(k => {
    appendMapRow(mapsTable, k, s.maps[k], {
      hit: String(s.hitKey) === String(k),
      newest: String(s.newestMapsKey) === String(k),
    });
  });

  for (let i = keys.length; i < FINAL_MAP_ROW_COUNT; i++) {
    appendMapRow(mapsTable, '0', '0', { placeholder: true });
  }
}

// ── Render ────────────────────────────────────────────────────────────────
function render() {
  if (cur < 0) {
    NUMS2.forEach((_, i) => {
      const el = document.getElementById(`n2-${i}`);
      if (el) el.className = 'cell';
      const p = document.getElementById(`ptr2-${i}`);
      if (p) p.innerHTML = '';
    });
    NUMS1.forEach((_, i) => {
      const el = document.getElementById(`n1-${i}`);
      if (el) el.className = 'cell';
      const p = document.getElementById(`ptr1-${i}`);
      if (p) p.innerHTML = '';
      const r = document.getElementById(`res-${i}`);
      if (r) { r.className = 'res-cell'; r.textContent = '?'; }
    });
    document.getElementById('stack-area').innerHTML = '<span class="stack-empty">stack = []</span>';
    renderMapsTable({ maps: {}, hitKey: null, newestMapsKey: null });
    renderCtrl(-1, STEPS.length, '');
    document.getElementById('vars-bar').innerHTML = '<span class="var-dim">variable state</span>';
    highlightLine(null);
    return;
  }

  const s = STEPS[cur];
  highlightLine(s.line);
  renderCtrl(cur, STEPS.length, s.info);

  // Vars bar
  const parts = [];
  if (s.phase === 'scan') {
    const num = s.numIdx2 !== null ? NUMS2[s.numIdx2] : null;
    if (num !== null) parts.push(`<span><span class="var-name">num</span> <span class="var-eq">=</span> <span class="var-val">${num}</span></span>`);
    if (s.keyVal !== null) parts.push(`<span><span class="var-name">key</span> <span class="var-eq">=</span> <span class="var-val">${s.keyVal}</span></span>`);
    parts.push(`<span><span class="var-name">stack</span> <span class="var-eq">=</span> <span style="color:#333;">[${s.stack.join(', ')}]</span></span>`);
  } else {
    const num = s.numIdx1 !== null ? NUMS1[s.numIdx1] : null;
    if (num !== null) parts.push(`<span><span class="var-name">num</span> <span class="var-eq">=</span> <span class="var-val">${num}</span></span>`);
    parts.push(`<span><span class="var-name">res</span> <span class="var-eq">=</span> <span style="color:#333;">[${s.res ? s.res.join(', ') : ''}]</span></span>`);
  }
  const mapsStr = '{' + Object.entries(s.maps).map(([k,v]) => `${k}: ${v}`).join(', ') + '}';
  parts.push(`<span><span class="var-name">maps</span> <span class="var-eq">=</span> <span style="color:#333;">${mapsStr}</span></span>`);
  document.getElementById('vars-bar').innerHTML = parts.join('');

  // nums2 cells
  NUMS2.forEach((val, i) => {
    const el = document.getElementById(`n2-${i}`);
    const ptr = document.getElementById(`ptr2-${i}`);
    if (!el) return;

    let cls = 'cell';
    let ptrHtml = '';

    if (s.poppingVal === val) {
      cls += ' popping';
      ptrHtml = `<span style="color:#3A9E7E;font-weight:700;">✓</span>`;
    } else if (s.numIdx2 === i) {
      cls += ' active';
      ptrHtml = `<span style="color:#d4a800;font-weight:700;">num</span>`;
    } else if (s.stack.includes(val) && s.scannedSet2.has(i)) {
      cls += ' in-stack';
    } else if (s.scannedSet2.has(i)) {
      cls += ' scanned';
    }

    el.className = cls;
    if (ptr) ptr.innerHTML = ptrHtml;
  });

  // Stack — vertical, bottom to top
  const stackArea = document.getElementById('stack-area');
  if (s.stack.length === 0) {
    stackArea.innerHTML = '<span class="stack-empty">stack = []</span>';
  } else {
    stackArea.innerHTML = '';
    s.stack.forEach((val, idx) => {
      const isTop = idx === s.stack.length - 1;
      const isPopping = s.poppingVal === val;
      const isCurrentNum = s.numIdx2 !== null && NUMS2[s.numIdx2] === val && isTop;
      const el = document.createElement('div');
      el.className = 'stack-cell' + (isPopping ? ' popping' : isCurrentNum ? ' pushing' : isTop ? ' top' : '');
      el.textContent = val;
      if (isTop && !isPopping) {
        const lbl = document.createElement('span');
        lbl.className = 'stack-label';
        lbl.textContent = '← stack[-1]';
        el.appendChild(lbl);
      }
      stackArea.appendChild(el);
    });
  }

  renderMapsTable(s);

  // nums1 cells + ptr (phase 2 only)
  NUMS1.forEach((_, i) => {
    const el = document.getElementById(`n1-${i}`);
    const ptr = document.getElementById(`ptr1-${i}`);
    if (!el) return;
    if (s.phase === 'result') {
      if (s.doneSet1.has(i)) {
        el.className = 'cell done';
        if (ptr) ptr.innerHTML = '';
      } else if (s.numIdx1 === i) {
        el.className = 'cell querying';
        if (ptr) ptr.innerHTML = `<span style="color:#d4a800;font-weight:700;">num</span>`;
      } else {
        el.className = 'cell';
        if (ptr) ptr.innerHTML = '';
      }
    } else {
      el.className = 'cell';
      if (ptr) ptr.innerHTML = '';
    }
  });

  // Result cells
  if (s.res !== null) {
    NUMS1.forEach((_, i) => {
      const el = document.getElementById(`res-${i}`);
      if (!el) return;
      if (i < s.res.length) {
        el.textContent = s.res[i];
        el.className = i === s.res.length - 1 && s.numIdx1 === i ? 'res-cell newest' : 'res-cell filled';
      } else {
        el.textContent = '?'; el.className = 'res-cell';
      }
    });
  } else {
    NUMS1.forEach((_, i) => {
      const el = document.getElementById(`res-${i}`);
      if (el) { el.textContent = '?'; el.className = 'res-cell'; }
    });
  }
}

buildDOM();
doReset();
</script>
</body>
</html>
