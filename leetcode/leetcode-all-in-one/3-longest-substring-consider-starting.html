<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3. Longest Substring Without Repeating Characters</title>
<link rel="stylesheet" href="shared.css?v=info-hud">
<style>
  /* Keep the merged page split stable while the code block swaps. */
  .main.layout-grid.ls3-layout .code-half { width: 100%; min-width: 0; }
  .ls3-layout .code-stack { width: 100%; min-width: 0; }
  .ls3-layout .code-panel { width: 100%; min-width: 0; overflow-x: auto; }
  .ls3-layout .code-block { width: max-content; min-width: 100%; }

  /* String visualization */
  .str-row { display: flex; align-items: flex-end; gap: 6px; }
  .str-cell { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .cell-box {
    width: 44px; height: 44px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700; font-family: 'SF Mono', monospace;
    background: #f5f5f5; color: #1a1a1a;
    transition: background 0.2s, transform 0.2s, opacity 0.2s;
  }
  .cell-box.in-window  { background: rgba(139,133,212,0.22); }
  .cell-box.active-j   { background: rgba(249,203,66,0.50); transform: scale(1.08); }
  .cell-box.blocked    { background: rgba(247,140,108,0.35); transform: scale(1.08); }
  .cell-box.shrinking  { background: rgba(93,202,165,0.45); }
  .cell-box.done       { opacity: 0.28; }
  .cell-idx { font-size: 11px; color: #aaa; font-family: 'SF Mono', monospace; }
  .cell-ptr { font-size: 11px; font-weight: 700; font-family: 'SF Mono', monospace; height: 16px; line-height: 16px; }
  .ptr-i    { color: #3A6FD4; }
  .ptr-j    { color: #B07800; }
  .ptr-both { color: #C4501E; }

  /* Window underline bar */
  .window-bar { display: flex; gap: 6px; height: 5px; margin-top: 5px; margin-bottom: 2px; }
  .win-seg    { width: 44px; height: 5px; border-radius: 3px; background: transparent; transition: background 0.2s; }
  .win-seg.in-window { background: rgba(139,133,212,0.55); }

  /* Maps visualization */
  .maps-area {
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: flex-start;
    min-height: 38px;
  }
  .map-entry {
    display: flex; align-items: center; gap: 3px;
    background: #f5f5f5; border-radius: 6px; padding: 4px 10px;
    font-family: 'SF Mono', monospace; font-size: 13px;
    transition: background 0.2s, opacity 0.2s;
  }
  .map-entry.dup  { background: rgba(247,140,108,0.35); }
  .map-entry.zero { opacity: 0.32; }
  .map-key   { color: #9333C0; font-weight: 700; }
  .map-colon { color: #888; margin: 0 1px; }
  .map-val   { color: #C4501E; font-weight: 700; }
</style>
</head>
<body>
<link rel="stylesheet" href="ink.css">
<script src="catalog.js"></script>
<script src="sidebar.js?v=ls3-default-s2"></script>
<script src="shared.js?v=copybtn"></script>

<div class="content-wrapper">
<script>
renderHeader({
  title: '3. Longest Substring Without Repeating Characters',
  link: 'https://leetcode.com/problems/longest-substring-without-repeating-characters/',
  examples: [
    { id: 'ending', label: 'Solution 2: Consider Ending 🖤' },
    { id: 'starting', label: 'Solution 1: Consider Starting' },
  ],
  examplesLabel: 'Solution:',
  legend: [
    { color: 'rgba(249,203,66,0.50)', label: 's[j] is being added / checked' },
    { color: 'rgba(139,133,212,0.22)', label: 'current window' },
    { color: 'rgba(93,202,165,0.45)', label: 's[i] being removed' },
    { color: 'rgba(247,140,108,0.35)', label: 'duplicate blocks extension' },
  ],
});
</script>

<div class="main layout-grid ls3-layout">
  <div class="code-half">
    <div class="code-stack">
      <div class="step-info" id="info"></div>
      <aside class="code-panel" id="code-panel"></aside>
    </div>
  </div>

  <div class="viz-panel">
    <div class="var-bar" id="pointer-bar">
      <span class="var-row"></span>
      <span class="var-row"></span>
    </div>

    <div class="card">
      <h3>Input String  s = "abcabcbb"</h3>
      <div class="str-row" id="str-row"></div>
      <div class="window-bar" id="window-bar"></div>
    </div>

    <div class="var-bar" id="window-map-bar">
      <span class="var-row"></span>
      <span class="var-row"></span>
    </div>

    <div class="card">
      <h3>Frequency Map  maps</h3>
      <div class="var-row var-win" id="freq-window-row" style="font-family:'SF Mono','Menlo',monospace;font-size:13px;margin-bottom:14px;"></div>
      <div class="maps-area" id="maps-area">
        <span style="font-size:12px;color:#aaa;font-family:'SF Mono',monospace;">maps = {}</span>
      </div>
    </div>
  </div>
</div>
</div>

<script>
const S = "abcabcbb";

const SOLUTIONS = {
  starting: {
    hash: 'solution1',
    code: `
class Solution:
    def lengthOfLongestSubstring(self, s: str) -> int:
        if not s or len(s)==0:
            return 0

        i = 0
        j = 0
        maps = {}
        ans = 0

        # solution1: 考虑开头
        for i in range(len(s)):
            while j<len(s) and s[j] not in maps:
                maps[s[j]] = maps.get(s[j],0) + 1
                j+=1
            ans = max(ans, j - i)
            maps.pop(s[i])
        return ans`,
    buildSteps: buildStartingSteps,
  },
  ending: {
    hash: 'solution2',
    code: `
class Solution:
    def lengthOfLongestSubstring(self, s: str) -> int:
        if not s or len(s)==0:
            return 0

        i = 0
        j = 0
        maps = {}
        ans = 0

        # solution2: 考虑结尾
        for j in range(len(s)):
            maps[s[j]] = maps.get(s[j],0) + 1
            while maps.get(s[j],0) > 1:
                maps[s[i]] -= 1
                i+=1
            ans = max(ans, j - i + 1)

        return ans`,
    buildSteps: buildEndingSteps,
  },
};

let activeSolution = 'ending';
let STEPS = [];
let cur = -1;

function buildStartingSteps() {
  const steps = [];
  let i = null, j = null, ans = null;
  let maps = {};
  let mapsReady = false;
  let addIdx = null;
  let blockedIdx = null;
  let popIdx = null;

  function snap(line, info) {
    steps.push({ line, info, i, j, ans, maps: { ...maps }, mapsReady, addIdx, blockedIdx, popIdx });
  }

  snap(3, `s = "${S}" - not empty, continue`);

  i = 0; addIdx = null; blockedIdx = null; popIdx = null;
  snap(6, 'i = 0  (left boundary of the sliding window)');
  j = 0;
  snap(7, 'j = 0  (right boundary before the loop starts)');
  maps = {};
  mapsReady = true;
  snap(8, 'maps = {}  (char -> count for all chars inside window)');
  ans = 0;
  snap(9, 'ans = 0  (length of longest valid window seen so far)');

  for (let ii = 0; ii < S.length; ii++) {
    i = ii;
    addIdx = null;
    blockedIdx = null;
    popIdx = null;
    snap(12, `i = ${ii}  ->  treat s[${ii}] = '${S[ii]}' as the window start`);

    if (j < S.length && !(S[j] in maps)) {
      snap(13, `j = ${j}, s[${j}] = '${S[j]}' is not in maps  ->  enter while and extend right`);
    } else {
      blockedIdx = j < S.length ? j : null;
      snap(13, j >= S.length
        ? `j = ${j} has reached len(s)  ->  cannot extend`
        : `j = ${j}, s[${j}] = '${S[j]}' is already in maps  ->  stop before duplicate`);
      blockedIdx = null;
    }

    while (j < S.length && !(S[j] in maps)) {
      addIdx = j;
      maps[S[j]] = (maps[S[j]] || 0) + 1;
      snap(14, `maps['${S[j]}'] = ${maps[S[j]]}  (add s[${j}] to window)`);
      j++;
      addIdx = null;
      snap(15, `j += 1  ->  j = ${j}  (window is now [${i}, ${j}))`);
      if (j < S.length && !(S[j] in maps)) {
        snap(13, `check again: s[${j}] = '${S[j]}' is not in maps  ->  keep extending`);
      }
    }

    if (j < S.length) {
      blockedIdx = j;
      snap(13, `check again: s[${j}] = '${S[j]}' is already in maps  ->  exit while`);
      blockedIdx = null;
    } else {
      snap(13, `check again: j = ${j} has reached len(s)  ->  exit while`);
    }

    const oldAns = ans;
    const winLen = j - i;
    ans = Math.max(oldAns, winLen);
    snap(16, `ans = max(${oldAns}, ${j} - ${i}) = max(${oldAns}, ${winLen}) = ${ans}`);

    popIdx = i;
    const popped = S[i];
    delete maps[popped];
    snap(17, `maps.pop('${popped}')  ->  remove s[${i}] before the next start`);
    popIdx = null;
  }

  snap(18, `return ans = ${ans}  ->  longest substring without repeating chars has length 3`);
  return steps;
}

function buildEndingSteps() {
  const steps = [];
  let i = null, j = null, ans = null;
  let maps = {};
  let mapsReady = false;
  let shrinkIdx = null;

  function snap(line, info) {
    steps.push({ line, info, i, j, ans, maps: { ...maps }, mapsReady, shrinkIdx });
  }

  snap(3, `s = "${S}" - not empty, continue`);

  i = 0; shrinkIdx = null;
  snap(6, 'i = 0  (left boundary of the sliding window)');
  j = 0;
  snap(7, 'j = 0  (right boundary before the loop starts)');
  maps = {};
  mapsReady = true;
  snap(8, 'maps = {}  (char -> count for all chars inside window)');
  ans = 0;
  snap(9, 'ans = 0  (length of longest valid window seen so far)');

  for (let jj = 0; jj < S.length; jj++) {
    j = jj; shrinkIdx = null;
    snap(12, `j = ${jj}  ->  s[${jj}] = '${S[jj]}'  (right pointer advances)`);

    maps[S[jj]] = (maps[S[jj]] || 0) + 1;
    snap(13, maps[S[jj]] > 1
      ? `maps['${S[jj]}'] = ${maps[S[jj]]}  duplicate detected`
      : `maps['${S[jj]}'] = ${maps[S[jj]]}  still unique`);

    if (maps[S[jj]] > 1) {
      snap(14, `maps['${S[jj]}'] = ${maps[S[jj]]} > 1  ->  enter while loop, shrink from left`);
      while (maps[S[jj]] > 1) {
        shrinkIdx = i;
        maps[S[i]] -= 1;
        snap(15, `maps['${S[i]}'] -= 1  ->  ${maps[S[i]]}  (evict s[${i}] = '${S[i]}' from window)`);
        i++;
        shrinkIdx = null;
        snap(16, `i += 1  ->  i = ${i}  (left boundary shifts right)`);
        if (maps[S[jj]] > 1) {
          snap(14, `maps['${S[jj]}'] = ${maps[S[jj]]} > 1  ->  still duplicate, keep shrinking`);
        }
      }
      snap(14, `maps['${S[jj]}'] = ${maps[S[jj]]} <= 1  ->  no duplicate, exit while loop`);
    } else {
      snap(14, `maps['${S[jj]}'] = ${maps[S[jj]]} <= 1  ->  no duplicate, skip while loop`);
    }

    const oldAns = ans;
    const winLen = jj - i + 1;
    ans = Math.max(oldAns, winLen);
    snap(17, `ans = max(${oldAns}, ${jj} - ${i} + 1) = max(${oldAns}, ${winLen}) = ${ans}`);
  }

  shrinkIdx = null;
  snap(19, `return ans = ${ans}  ->  longest substring without repeating chars has length 3`);
  return steps;
}

function renderCode() {
  let n = 0;
  const lines = String(SOLUTIONS[activeSolution].code).replace(/^\n/, '').replace(/\s+$/, '').split('\n');
  document.getElementById('code-panel').innerHTML =
    `<pre class="code-block">` +
    lines.map(line => {
      n += 1;
      return `<span class="code-line" data-l="${n}"><span class="ln">${n}</span>${pyHighlight(line)}</span>`;
    }).join('\n') +
    `</pre>`;
}

function formatMapsInline(maps) {
  const entries = Object.entries(maps);
  if (entries.length === 0) return '{}';
  return `{ ${entries.map(([k, v]) => `'${k}': ${v}`).join(', ')} }`;
}

function windowText(state) {
  if (state.i === null || state.j === null) return '';
  if (activeSolution === 'starting') {
    return `Window [i, j): <strong>"${S.slice(state.i, state.j)}"</strong> (len ${Math.max(0, state.j - state.i)})`;
  }
  return `Window [i..j]: <strong>"${S.slice(state.i, state.j + 1)}"</strong> (len ${state.j - state.i + 1})`;
}

function renderVarBar(state) {
  const empty = '<span class="var-row"></span>';
  if (!state) {
    document.getElementById('pointer-bar').innerHTML = empty.repeat(2);
    document.getElementById('window-map-bar').innerHTML = empty.repeat(2);
    document.getElementById('freq-window-row').innerHTML = '';
    return;
  }

  const pointerRows = [
    state.i !== null
      ? `<span class="var-row"><span class="var-name">i</span><span class="var-eq"> = </span><span class="var-val">${state.i}</span></span>`
      : empty,
    state.j !== null
      ? `<span class="var-row"><span class="var-name">j</span><span class="var-eq"> = </span><span class="var-val">${state.j}</span></span>`
      : empty,
  ];
  const windowMapRows = [
    state.mapsReady
      ? `<span class="var-row"><span class="var-name">maps</span><span class="var-eq"> = </span><span style="color:#333;">${formatMapsInline(state.maps)}</span></span>`
      : empty,
    state.ans !== null
      ? `<span class="var-row"><span class="var-name">ans</span><span class="var-eq"> = </span><span class="var-val">${state.ans}</span></span>`
      : empty,
  ];
  document.getElementById('pointer-bar').innerHTML = pointerRows.join('');
  document.getElementById('window-map-bar').innerHTML = windowMapRows.join('');
  document.getElementById('freq-window-row').innerHTML = windowText(state);
}

function buildStringDOM() {
  const row = document.getElementById('str-row');
  const winBar = document.getElementById('window-bar');
  row.innerHTML = '';
  winBar.innerHTML = '';
  for (let idx = 0; idx < S.length; idx++) {
    const cell = document.createElement('div');
    cell.className = 'str-cell';

    const box = document.createElement('div');
    box.className = 'cell-box';
    box.id = `cell-${idx}`;
    box.textContent = S[idx];
    cell.appendChild(box);

    const idxLbl = document.createElement('div');
    idxLbl.className = 'cell-idx';
    idxLbl.textContent = idx;
    cell.appendChild(idxLbl);

    const ptrLbl = document.createElement('div');
    ptrLbl.className = 'cell-ptr';
    ptrLbl.id = `ptr-${idx}`;
    cell.appendChild(ptrLbl);

    row.appendChild(cell);

    const seg = document.createElement('div');
    seg.className = 'win-seg';
    seg.id = `win-${idx}`;
    winBar.appendChild(seg);
  }
}

function render() {
  if (cur < 0) {
    for (let idx = 0; idx < S.length; idx++) {
      const box = document.getElementById(`cell-${idx}`);
      if (box) box.className = 'cell-box';
      const ptr = document.getElementById(`ptr-${idx}`);
      if (ptr) { ptr.textContent = ''; ptr.className = 'cell-ptr'; }
      const seg = document.getElementById(`win-${idx}`);
      if (seg) seg.className = 'win-seg';
    }
    renderVarBar(null);
    document.getElementById('maps-area').innerHTML =
      `<span style="font-size:12px;color:#aaa;font-family:'SF Mono',monospace;">maps = {}</span>`;
    renderCtrl(-1, STEPS.length, '');
    highlightLine(null);
    return;
  }

  const s = STEPS[cur];
  const isStarting = activeSolution === 'starting';
  highlightLine(s.line);
  renderCtrl(cur, STEPS.length, s.info);

  for (let idx = 0; idx < S.length; idx++) {
    const box = document.getElementById(`cell-${idx}`);
    const ptr = document.getElementById(`ptr-${idx}`);
    const seg = document.getElementById(`win-${idx}`);
    if (!box || !ptr) continue;

    const isJ = s.j !== null && idx === s.j;
    const isI = s.i !== null && idx === s.i;
    const isAdd = isStarting && s.addIdx !== null && idx === s.addIdx;
    const isBlocked = isStarting && s.blockedIdx !== null && idx === s.blockedIdx;
    const isRemoving = isStarting
      ? s.popIdx !== null && idx === s.popIdx
      : s.shrinkIdx !== null && idx === s.shrinkIdx;
    const inWindow = isStarting
      ? s.i !== null && s.j !== null && idx >= s.i && idx < s.j
      : s.i !== null && s.j !== null && idx >= s.i && idx <= s.j;
    const isDone = s.i !== null && idx < s.i;

    let cls = 'cell-box';
    if      (isRemoving) cls += ' shrinking';
    else if (isBlocked)  cls += ' blocked';
    else if (isAdd)      cls += ' active-j';
    else if (!isStarting && isJ) cls += ' active-j';
    else if (inWindow)   cls += ' in-window';
    else if (isDone)     cls += ' done';
    box.className = cls;

    if (isRemoving && isJ) { ptr.textContent = isStarting ? 'i j' : 'i=j'; ptr.className = 'cell-ptr ptr-both'; }
    else if (isRemoving)   { ptr.textContent = 'i';   ptr.className = 'cell-ptr ptr-i'; }
    else if (isI && isJ)   { ptr.textContent = 'i j'; ptr.className = 'cell-ptr ptr-both'; }
    else if (isI)          { ptr.textContent = 'i';   ptr.className = 'cell-ptr ptr-i'; }
    else if (isJ)          { ptr.textContent = 'j';   ptr.className = 'cell-ptr ptr-j'; }
    else                   { ptr.textContent = '';    ptr.className = 'cell-ptr'; }

    if (seg) seg.className = inWindow ? 'win-seg in-window' : 'win-seg';
  }

  renderVarBar(s);

  const ma = document.getElementById('maps-area');
  const entries = Object.entries(s.maps);
  if (entries.length === 0) {
    ma.innerHTML = `<span style="font-size:12px;color:#aaa;font-family:'SF Mono',monospace;">maps = {}</span>`;
  } else {
    ma.innerHTML = entries.map(([k, v]) => {
      let cls = 'map-entry';
      if (v > 1) cls += ' dup';
      else if (v === 0) cls += ' zero';
      return `<div class="${cls}"><span class="map-key">'${k}'</span><span class="map-colon">:</span><span class="map-val">${v}</span></div>`;
    }).join('');
  }
}

function solutionFromHash() {
  return location.hash === '#solution1' || location.hash === '#starting' ? 'starting' : 'ending';
}

function loadExample(id, updateHash = true) {
  if (!SOLUTIONS[id]) return;
  stopAuto();
  activeSolution = id;
  renderCode();
  STEPS = SOLUTIONS[id].buildSteps();
  cur = -1;
  render();
  lockStableSizes();
  Object.keys(SOLUTIONS).forEach(k => {
    const btn = document.getElementById('ex-' + k);
    if (btn) btn.classList.toggle('auto-active', k === id);
  });
  if (updateHash) {
    history.replaceState(null, '', '#' + SOLUTIONS[id].hash);
  }
}

window.addEventListener('hashchange', () => loadExample(solutionFromHash(), false));

buildStringDOM();
loadExample(solutionFromHash(), false);
</script>
</body>
</html>
