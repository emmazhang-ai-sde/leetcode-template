<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>739. Daily Temperatures — Monotonic Stack Animation</title>
<link rel="stylesheet" href="shared.css?v=info-hud">
<style>
  .code-line.hl { background: rgba(199,146,234,0.18); }
  .viz-panel { gap: 14px; }
  .ctrl { margin-bottom: 10px; }
  .leg-box { width: 13px; height: 13px; border-radius: 3px; }

  /* Cells */
  .cell-group { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .cell { width: 44px; height: 44px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; font-family: 'SF Mono', monospace; background: #f5f5f5; color: #1a1a1a; transition: background 0.2s, transform 0.15s, opacity 0.2s; margin: 0 2px; }
  .cell.active   { background: rgba(249,203,66,0.45); transform: scale(1.08); }
  .cell.scanned  { opacity: 0.3; }
  .cell.in-stack { background: rgba(139,133,212,0.25); }
  .cell.popping  { background: rgba(93,202,165,0.45); transform: scale(1.1); }
  .cell-idx { font-size: 10px; color: #aaa; font-family: 'SF Mono', monospace; }

  /* Pointer row */
  .ptr-row { display: flex; margin-top: 4px; }
  .ptr-cell { width: 44px; margin: 0 2px; display: flex; justify-content: center; font-size: 12px; font-weight: 700; color: #9333C0; }

  /* Stack */
  .stack-container { display: flex; flex-direction: column-reverse; align-items: center; gap: 4px; min-height: 200px; justify-content: flex-start; padding: 8px 0; }
  .stack-cell { width: 100px; height: 44px; border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 5px; font-family: 'SF Mono', monospace; background: rgba(139,133,212,0.2); color: #1a1a1a; transition: all 0.25s; position: relative; }
  .stack-cell.top     { background: rgba(139,133,212,0.4); }
  .stack-cell.popping { background: rgba(93,202,165,0.45); transform: translateX(8px); }
  .stack-cell.pushing { background: rgba(249,203,66,0.4); }
  .stack-idx { font-size: 16px; font-weight: 800; }
  .stack-val { font-size: 11px; color: #8B85D4; font-weight: 600; }
  .stack-label { font-size: 10px; color: #8B85D4; font-weight: 600; position: absolute; right: -32px; top: 50%; transform: translateY(-50%); }
  .stack-empty { font-size: 12px; color: #aaa; font-family: 'SF Mono', monospace; }
  .stack-base { width: 108px; height: 3px; background: #ccc; border-radius: 2px; margin-top: 4px; }

  /* Result array */
  .res-cell { width: 44px; height: 44px; border-radius: 8px; margin: 0 2px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; font-family: 'SF Mono', monospace; background: #f5f5f5; color: #bbb; transition: background 0.2s, color 0.2s; }
  .res-cell.filled  { background: rgba(247,140,108,0.25); color: #1a1a1a; }
  .res-cell.newest  { background: rgba(247,140,108,0.55); color: #1a1a1a; transform: scale(1.08); }
  .res-cell.zero    { color: #bbb; }

  /* Visualization split: stack on the left, arrays on the right */
  .dt-viz-grid { display: grid; grid-template-columns: max-content max-content; gap: 24px; align-items: start; }
  .dt-array-col { display: flex; flex-direction: column; gap: 24px; min-width: max-content; }
  .dt-array-card { min-width: max-content; }
  .dt-array-row {
    display: grid !important;
    grid-template-columns: repeat(8, 48px);
    width: max-content;
    align-items: start;
  }
  .dt-array-row > .cell-group {
    width: 48px;
  }
  .dt-array-row > .ptr-cell {
    width: 44px;
    margin: 0 2px;
  }
  .dt-stack-card { display: flex; flex-direction: column; align-items: center; min-height: 360px; }
  .dt-stack-card h3 { align-self: flex-start; }
  .dt-stack-card .stack-container { flex: 1; }

  /* Calc highlight */
  .calc-box { display: inline-block; background: rgba(93,202,165,0.15); border-radius: 6px; padding: 3px 10px; font-family: 'SF Mono', monospace; font-size: 13px; margin-top: 4px; }
</style>
</head>
<body>
<link rel="stylesheet" href="ink.css">
<script src="catalog.js"></script>
<script src="sidebar.js"></script>
<script src="shared.js?v=copybtn"></script>
<div class="content-wrapper">
<script>
renderHeader({
  title: '739. Daily Temperatures — Monotonic Stack Animation',
  link: 'https://leetcode.com/problems/daily-temperatures/',
  legend: [
    { color: 'rgba(249,203,66,0.45)', label: 'current temperature' },
    { color: 'rgba(139,133,212,0.25)', label: 'in stack (waiting)' },
    { color: 'rgba(93,202,165,0.45)', label: 'popped — warmer day found' },
    { color: '#f0f0f0', extra: 'opacity:0.4;', label: 'already processed' },
  ],
});
</script>
<div class="main layout-grid">
    <!-- Code panel -->
    <script>
    renderCodeBox({
      code: `
def dailyTemperatures(self, temperatures):
    stack = []
    res = [0] * len(temperatures)

    for index, temperature in enumerate(temperatures):
        while stack and temperature > temperatures[stack[-1]]:
            key = stack.pop()
            res[key] = index - key
        stack.append(index)
    return res`,
    });
    </script>

    <!-- Viz panel -->
    <div class="viz-panel">

      <!-- Vars bar -->
      <div class="var-bar" id="vars-bar"><span class="var-dim">variable state</span></div>

      <div class="dt-viz-grid">
        <!-- Left column: stack indices only -->
        <div class="card dt-stack-card">
          <h3>stack indices</h3>
          <div style="font-size:11px;color:#8B85D4;margin-bottom:6px;">top ↑</div>
          <div class="stack-container" id="stack-area">
            <span class="stack-empty">stack = []</span>
          </div>
          <div class="stack-base"></div>
          <div style="font-size:11px;color:#aaa;margin-top:4px;">bottom</div>
        </div>

        <!-- Right column: temperatures and result arrays -->
        <div class="dt-array-col">
          <div class="card dt-array-card">
            <h3>temperatures array</h3>
            <div style="font-size:12px;color:#aaa;font-family:'SF Mono',monospace;margin-bottom:8px;">
              [73, 74, 75, 71, 69, 72, 76, 73]
            </div>
            <div style="display:flex;" class="dt-array-row" id="temps-row"></div>
            <div style="display:flex;" class="ptr-row dt-array-row" id="ptr-row"></div>
          </div>

          <div class="card dt-array-card">
            <h3>res array</h3>
            <div style="display:flex;gap:0;" class="dt-array-row" id="res-row"></div>
            <div style="font-size:12px;color:#aaa;margin-top:10px;font-family:'SF Mono',monospace;" id="res-label">res = [0, 0, 0, 0, 0, 0, 0, 0]</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const TEMPS = [73, 74, 75, 71, 69, 72, 76, 73];
const N = TEMPS.length;

function buildSteps() {
  const steps = [];

  let stack = [];
  let res = new Array(N).fill(0);
  let numIdx = null;
  let poppingIdx = null;
  let keyIdx = null;
  let scannedSet = new Set();
  let newestResKey = null;
  let stackReady = false;
  let resReady = false;

  function snap(line, info) {
    steps.push({
      line, info,
      stack: [...stack],
      res: [...res],
      numIdx,
      poppingIdx,
      keyIdx,
      scannedSet: new Set(scannedSet),
      newestResKey,
      stackReady,
      resReady,
    });
  }

  stackReady = true;
  snap(2, 'Line 2: stack = []');
  resReady = true;
  snap(3, `Line 3: res = [0] * ${N}  (pre-fill with zeros)`);

  for (let i = 0; i < N; i++) {
    const temp = TEMPS[i];
    numIdx = i;
    newestResKey = null;

    snap(5, `Line 5: index=${i}, temperature=${temp}`);

    if (stack.length > 0 && temp > TEMPS[stack[stack.length - 1]]) {
      snap(6, `Line 6: stack[-1]=${stack[stack.length-1]}, temps[${stack[stack.length-1]}]=${TEMPS[stack[stack.length-1]]} < temperature(${temp}) → TRUE, enter while`);
    } else {
      snap(6, stack.length === 0
        ? `Line 6: stack is empty → condition FALSE, skip while`
        : `Line 6: temps[stack[-1]=${stack[stack.length-1]}]=${TEMPS[stack[stack.length-1]]} ≥ temperature(${temp}) → FALSE, skip while`
      );
    }

    while (stack.length > 0 && temp > TEMPS[stack[stack.length - 1]]) {
      const topIdx = stack[stack.length - 1];
      stack.pop();
      keyIdx = topIdx;
      poppingIdx = topIdx;
      snap(7, `Line 7: key = stack.pop() → key = ${topIdx}  (temps[${topIdx}]=${TEMPS[topIdx]})`);
      const days = i - topIdx;
      res[topIdx] = days;
      newestResKey = topIdx;
      snap(8, `Line 8: res[${topIdx}] = index − key = ${i} − ${topIdx} = ${days}  (waited ${days} day${days !== 1 ? 's' : ''})`);
      poppingIdx = null; keyIdx = null; newestResKey = null;

      if (stack.length > 0 && temp > TEMPS[stack[stack.length - 1]]) {
        snap(6, `Line 6: check again → temps[${stack[stack.length-1]}]=${TEMPS[stack[stack.length-1]]} < ${temp} → TRUE`);
      } else {
        snap(6, stack.length === 0
          ? `Line 6: check again → stack empty → FALSE, exit while`
          : `Line 6: check again → temps[${stack[stack.length-1]}]=${TEMPS[stack[stack.length-1]]} ≥ ${temp} → FALSE, exit while`
        );
      }
    }
    poppingIdx = null; keyIdx = null;

    stack.push(i);
    snap(9, `Line 9: stack.append(${i}) → stack = [${stack.join(', ')}]`);
    scannedSet.add(i);
  }

  numIdx = null;
  snap(10, `Line 10: return res = [${res.join(', ')}]  (0 means no warmer day found) ✓`);
  return steps;
}

const STEPS = buildSteps();
let cur = -1;

function buildDOM() {
  const trow = document.getElementById('temps-row');
  trow.innerHTML = '';
  TEMPS.forEach((val, i) => {
    const g = document.createElement('div');
    g.className = 'cell-group';
    const c = document.createElement('div');
    c.className = 'cell'; c.id = `tc-${i}`; c.textContent = val;
    const idx = document.createElement('div');
    idx.className = 'cell-idx'; idx.textContent = `[${i}]`;
    g.appendChild(c); g.appendChild(idx);
    trow.appendChild(g);
  });

  const prow = document.getElementById('ptr-row');
  prow.innerHTML = '';
  TEMPS.forEach((_, i) => {
    const pc = document.createElement('div');
    pc.className = 'ptr-cell'; pc.id = `ptr-${i}`;
    prow.appendChild(pc);
  });

  const rrow = document.getElementById('res-row');
  rrow.innerHTML = '';
  TEMPS.forEach((_, i) => {
    const g = document.createElement('div');
    g.className = 'cell-group';
    const c = document.createElement('div');
    c.className = 'res-cell zero'; c.id = `rc-${i}`; c.textContent = '0';
    const idx = document.createElement('div');
    idx.className = 'cell-idx'; idx.textContent = `[${i}]`;
    g.appendChild(c); g.appendChild(idx);
    rrow.appendChild(g);
  });
}

function render() {
  if (cur < 0) {
    TEMPS.forEach((_, i) => {
      const el = document.getElementById(`tc-${i}`);
      if (el) el.className = 'cell';
      const p = document.getElementById(`ptr-${i}`);
      if (p) p.innerHTML = '';
      const r = document.getElementById(`rc-${i}`);
      if (r) { r.className = 'res-cell zero'; r.textContent = '0'; }
    });
    document.getElementById('stack-area').innerHTML = '<span class="stack-empty">stack = []</span>';
    document.getElementById('res-label').textContent = 'res = [0, 0, 0, 0, 0, 0, 0, 0]';
    renderCtrl(-1, STEPS.length, '');
    document.getElementById('vars-bar').innerHTML = '<span class="var-dim">variable state</span>';
    highlightLine(null);
    return;
  }

  const s = STEPS[cur];
  highlightLine(s.line);
  renderCtrl(cur, STEPS.length, s.info);

  // Vars bar
  let indexCell = '';
  let temperatureCell = '';
  let keyCell = '';
  if (s.numIdx !== null) {
    indexCell = `<span style="color:#9333C0;">index</span>=<span style="color:#C4501E;">${s.numIdx}</span>`;
    temperatureCell = `<span style="color:#9333C0;">temperature</span>=<span style="color:#C4501E;">${TEMPS[s.numIdx]}</span>`;
  }
  if (s.keyIdx !== null) {
    keyCell = `<span style="color:#9333C0;">key</span>=<span style="color:#C4501E;">${s.keyIdx}</span>`;
  }
  let stackCell = '';
  let resCell = '';
  if (s.stackReady) {
    stackCell = `<span style="color:#9333C0;">stack</span>=<span style="color:#333;">[${s.stack.join(', ')}]</span>`;
  }
  if (s.resReady) {
    resCell = `<span style="color:#9333C0;">res</span>=<span style="color:#333;">[${s.res.join(', ')}]</span>`;
  }
  document.getElementById('vars-bar').innerHTML =
    [indexCell, temperatureCell, keyCell, stackCell, resCell]
      .filter(Boolean)
      .map(cell => `<span>${cell}</span>`)
      .join('');

  // Temperatures cells
  TEMPS.forEach((_, i) => {
    const el = document.getElementById(`tc-${i}`);
    const ptr = document.getElementById(`ptr-${i}`);
    if (!el) return;

    let cls = 'cell';
    let ptrHtml = '';

    if (s.poppingIdx === i) {
      cls = 'cell popping';
      ptrHtml = `<span style="color:#3A9E7E;font-weight:700;">✓</span>`;
    } else if (s.numIdx === i) {
      cls = 'cell active';
      ptrHtml = `<span style="color:#d4a800;font-weight:700;">idx</span>`;
    } else if (s.stack.includes(i) && s.scannedSet.has(i)) {
      cls = 'cell in-stack';
    } else if (s.scannedSet.has(i)) {
      cls = 'cell scanned';
    }

    el.className = cls;
    if (ptr) ptr.innerHTML = ptrHtml;
  });

  // Stack
  const stackArea = document.getElementById('stack-area');
  if (s.stack.length === 0) {
    stackArea.innerHTML = '<span class="stack-empty">stack = []</span>';
  } else {
    stackArea.innerHTML = '';
    s.stack.forEach((idx, si) => {
      const isTop = si === s.stack.length - 1;
      const isPopping = s.poppingIdx === idx;
      const isPushing = s.numIdx === idx && isTop && !isPopping;
      const el = document.createElement('div');
      el.className = 'stack-cell' + (isPopping ? ' popping' : isPushing ? ' pushing' : isTop ? ' top' : '');
      const idxSpan = document.createElement('span');
      idxSpan.className = 'stack-idx';
      idxSpan.textContent = idx;
      const valSpan = document.createElement('span');
      valSpan.className = 'stack-val';
      valSpan.textContent = `(${TEMPS[idx]}°)`;
      el.appendChild(idxSpan);
      el.appendChild(valSpan);
      if (isTop && !isPopping) {
        const lbl = document.createElement('span');
        lbl.className = 'stack-label';
        lbl.textContent = '← top';
        el.appendChild(lbl);
      }
      stackArea.appendChild(el);
    });
  }

  // Result cells
  TEMPS.forEach((_, i) => {
    const el = document.getElementById(`rc-${i}`);
    if (!el) return;
    const val = s.res[i];
    const wasSet = val > 0;
    const isNewest = s.newestResKey === i;
    if (isNewest) {
      el.className = 'res-cell newest';
    } else if (wasSet) {
      el.className = 'res-cell filled';
    } else {
      el.className = 'res-cell zero';
    }
    el.textContent = val;
  });

  document.getElementById('res-label').textContent = `res = [${s.res.join(', ')}]`;
}

buildDOM();
doReset();
</script>
</body>
</html>
